// Buttons of the machines page: pausing is decided in the cloud; the rest are LogoGuard commands
// that travel to the machine through MachineChannel.
function wireMachines() {
  const box = $("#main");
  const who = () => $("#reviewer").value.trim() || null;
  const again = () => refreshMachinesPage();
  box.querySelectorAll("tr[data-machine]").forEach(r => r.onclick = () => openMachine(r.dataset.machine));
  const back = $("#mBack"); if (back) back.onclick = () => openMachine(null);
  box.querySelectorAll("#mRange button").forEach(b => b.onclick = () => { mHours = Number(b.dataset.h); again(); });
  box.querySelectorAll("#mRecent .dcard[data-job]").forEach(c => c.onclick = () => showDetail(c.dataset.job));
  box.querySelectorAll("button[data-pause]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api.machinePause(b.dataset.m, b.dataset.pause === "1"); toast(b.dataset.pause === "1" ? `${b.dataset.m} 已暂停` : `${b.dataset.m} 已恢复`); }
    catch (e) { toast(e.message); }
    again();
  });
  box.querySelectorAll("button[data-do]").forEach(b => b.onclick = async () => {
    const what = b.dataset.do, m = b.dataset.m;
    if (what === "stop" && !confirm(`停止 ${m} 上的检测程序？它会立刻结束并把显卡让出来，手头没做完的图会回到队列。之后要点"启动"它才会再工作。`)) return;
    b.disabled = true;
    try { await api.command(m, what, who()); toast(`已通过通道发给 ${m}：${DO[what]}`); }
    catch (e) { toast(e.message); }
    setTimeout(again, 4000);
  });
  const all = $("#updateAll");
  if (all) all.onclick = async () => {
    if (!confirm("把通道连得上的所有机器更新到最新发布的版本？每台会先停下检测，装好后原来在跑的会自己接着跑。")) return;
    all.disabled = true;
    try { const r = await api.command("*", "update", who()); toast(`已发给 ${r.sent.length} 台机器`); }
    catch (e) { toast(e.message); }
    setTimeout(again, 4000);
  };
}
function openMachine(name) {
  mView = name; mData = null;
  $("#main").innerHTML = `<div class="empty">加载中…</div>`;
  window.scrollTo(0, 0);
  refreshMachinesPage();
}
async function refreshMachinesPage() {
  if (view !== "machines" || document.hidden) return;
  clearTimeout(pollTimer);
  const asked = mView;
  try {
    if (asked) { const d = await api.machine(asked, midnight(), mHours); pinThumbs(d.recent); mData = d; }
    else { const r = await api.machines(midnight()); machinesData = r.machines; machinesMeta = { latest: r.latest, hosts: r.hosts || [], channelOnline: r.channel_online }; }
    mFailed = 0;
  } catch (e) {
    mFailed++;
    if (view === "machines" && asked === mView) {
      if ($("#main .dash")) toast("读取失败，稍后自动重试：" + e.message);
      else $("#main").innerHTML = `<div class="empty">加载失败：${esc(e.message)}，正在重试…</div>`;
    }
  }
  if (view !== "machines") return;
  if (asked === mView && !mFailed) {
    // the pictures of the latest results are lifted out and put back when nothing new finished,
    // so they do not blink every ten seconds
    const kept = $("#mRecent");
    $("#main").innerHTML = asked ? machineHtml(mData) : fleetHtml();
    const fresh = $("#mRecent");
    if (kept && fresh && kept.dataset.key === fresh.dataset.key) fresh.replaceWith(kept);
    wireMachines();
  }
  pollTimer = setTimeout(refreshMachinesPage, mFailed ? Math.min(60000, 5000 * mFailed) : 10000);
}
const ago = s => { const m = Math.round((Date.now() - new Date(s)) / 60000);
  return m < 2 ? "刚刚" : m < 90 ? m + " 分钟前" : m < 2880 ? Math.round(m / 60) + " 小时前" : Math.round(m / 1440) + " 天前"; };

// ---- every finished image, and how each one was judged ------------------------------------
const VERDICT = { block: "拦截", review: "待确认", pass: "放行" };
const LAYER = { ocr: "文字识别", owl: "图案检测", gallery: "图库比对", vlm: "本地小模型", claude: "Claude 复核" };
const ISIP = { yes: "是 IP", no: "不是 IP", unsure: "拿不准" };
let recs = [], recFilter = "easy", recBusy = false, recExtended = false;  // extended: "再看 48 张" was used
// "easy" = waiting for a person, easiest to judge first (review priority, then most orders)
// "sonnet" / "local" / "human" = the images one of them looked at, by what it made of them
const SEEN = {
  sonnet: { name: "Sonnet 看过的", levels: { ip: "说是 IP", unsure: "拿不准", not_ip: "说不是 IP" },
    note: "卡片上的「拦截 / 待确认 / 放行」是机器最后的结论，下面一行是 Sonnet 的话" },
  local: { name: "本地模型看过的", levels: { listed: "认出名单内的 IP", unlisted: "认出名单外的名字", ignored: "认出了东西，规则没采用", nothing: "什么都没认出" },
    note: "本地模型每张图都看；「规则没采用」是把握不够、类别不送审或属于忽略词" },
  human: { name: "人检查过的", levels: { infringing: "判为侵权", false_positive: "判为放行", unsure: "拿不准" },
    note: "按标注时间，最新的在前；标注对这个设计的所有订单生效" },
};
const seenLevel = { sonnet: "ip", local: "listed", human: "infringing" };
let seenCounts = null, seenNext = 0, seenMore = false;  // of the list on screen; next row to ask for
const paged = () => recFilter === "easy" || recFilter in SEEN;  // lists read by position, not by time

// Claude's opinion in one line, for a card: who it says owns it, or that it sees no IP.
function claudeLine(c) {
  if (!c) return "";
  const owners = [...(c.candidates || []).filter(x => x.is_ip === "yes").map(x => x.owner || x.name),
                  ...(c.other_ip || []).map(o => o.owner || o.name)].filter(Boolean);
  const first = owners[0] ? "：" + owners[0] : "";
  return c.verdict === "ip" ? `<span class="sn ip">Sonnet：是 IP${esc(first)}</span>`
    : c.verdict === "not_ip" ? `<span class="sn no">Sonnet：不是 IP</span>` : `<span class="sn un">Sonnet：拿不准</span>`;
}
// The same opinion in full, for the review tab and wherever there is room.
function claudeBlock(c) {
  const head = { ip: "有 IP", not_ip: "没有 IP", unsure: "拿不准" }[c.verdict] || c.verdict;
  return `<div class="snbox"><b>Sonnet 的看法：${esc(head)}</b>
    ${(c.candidates || []).length ? `<table>${c.candidates.map(x => `<tr><td>${esc(x.name)}</td><td>${ISIP[x.is_ip] || esc(x.is_ip)}</td><td>${esc(x.owner || "")}</td><td>${esc(x.reason || "")}</td></tr>`).join("")}</table>` : ""}
    ${(c.other_ip || []).length ? `<div>另外认出：${c.other_ip.map(o => esc(o.name) + (o.owner ? `（${esc(o.owner)}）` : "")).join("、")}</div>` : ""}</div>`;
}
let recsDrawn = "";  // what the list on screen was drawn from; redrawn only when this changes

// The server signs a fresh link for a thumbnail on every answer. Keep the first one per picture
// (links last 12 h; kept 10) so the browser shows it from its cache instead of downloading it again.
const thumbLinks = new Map();
function pinThumbs(list) {
  for (const x of list || []) {
    if (!x || !x.thumb_path || !x.thumb_url) continue;
    const had = thumbLinks.get(x.thumb_path);
    if (had && Date.now() - had.at < 36000000) x.thumb_url = had.url;
    else thumbLinks.set(x.thumb_path, { url: x.thumb_url, at: Date.now() });
  }
  return list;
}
const recsKey = () => recFilter + (seenLevel[recFilter] || "") + JSON.stringify(seenCounts) + "|" + recs.map(r => r.id + (r.human || "") + r.verdict + (r.claude ? "c" : "")).join(",");
const hhmm = s => new Date(s).toLocaleTimeString("zh-CN", { hour12: false });
const nameOf = l => ips[l]?.name || l;

// In the lists by time a design shows once, however many files of it were checked: the card
// says how many. ("easy" is one card per design already.)
function recsShown() {
  if (recFilter === "easy") return recs;
  const first = new Map(), out = [];
  for (const r of recs) {
    if (r.design && first.has(r.design)) { first.get(r.design).same++; continue; }
    const card = { ...r, same: 1 };
    if (r.design) first.set(r.design, card);
    out.push(card);
  }
  return out;
}

function recCard(x) {
  const names = (x.labels || "").split("; ").filter(Boolean).map(nameOf).join("、");
  return `<div class="dcard ${esc(x.verdict)}" data-job="${x.id}" title="${esc(names)}">
    ${x.thumb_url ? `<img src="${esc(x.thumb_url)}" loading="lazy" alt="">` : `<div class="noimg">无缩略图</div>`}
    <span class="badge ${esc(x.verdict)}">${VERDICT[x.verdict] || ""}</span>${x.human ? `<span class="rep">已标注</span>` : x.cached ? `<span class="rep">重复</span>` : ""}
    <div class="cap"><div class="what ${names ? "" : "none"}">${esc(names) || (x.verdict === "pass" ? "没有发现问题" : "")}</div>
      ${claudeLine(x.claude)}
      <div class="when">${x.easy ? `${x.orders > 1 ? `<b>${num(x.orders)} 单</b> · ` : ""}${esc(PRIO[x.priority] || "")}` : (x.orders > 1 ? `<b>${num(x.orders)} 单</b> · ` : "") + hhmm(x.finished_at) + (x.same > 1 ? ` · 这一页 ${num(x.same)} 张` : "")}</div></div>
    ${(x.verdict === "review" || x.easy || x.seen) && !x.human ? `<div class="quick"><button class="yes" data-d="infringing">侵权</button><button class="no" data-d="false_positive">放行</button></div>` : ""}</div>`;
}

function recordsHtml() {
  const chip = (v, label) => `<button data-v="${v}" class="${recFilter === v ? "on" : ""}">${label}</button>`;
  return `<div class="chips">${chip("easy", "最容易判断的")}${chip("", "全部")}${chip("block", "拦截")}${chip("review", "待确认")}${chip("pass", "放行")}${Object.keys(SEEN).map(k => chip(k, SEEN[k].name)).join("")}
      ${recFilter in SEEN ? `<span class="levels">${Object.keys(SEEN[recFilter].levels).map(l => `<button data-l="${l}" class="${seenLevel[recFilter] === l ? "on" : ""}">${SEEN[recFilter].levels[l]}${seenCounts ? ` <b>${num(seenCounts[l])}</b>` : ""}</button>`).join("")}
        <span class="muted">最新的在前 · ${SEEN[recFilter].note}</span></span>` : ""}
      ${recFilter === "easy" ? `<span class="muted" style="align-self:center">等人确认的设计，最明显的排前面（机器已拦截 → Sonnet 确认是 IP → …），每个设计只出现一次</span>` : ""}</div>
    <div class="feed" id="recFeed">${recsShown().map(recCard).join("") || `<span class="muted">${recFilter === "easy" ? "没有等人确认的设计了" : "暂无"}</span>`}</div>
    ${(recFilter in SEEN ? seenMore : recs.length && recs.length % 48 === 0) ? `<button class="more" id="recMore">再看 48 张</button>` : ""}`;
}

async function loadRecords(more) {
  if (recBusy) return;  // the list chosen meanwhile is read when this answer is in (see below)
  recBusy = true;
  const asked = recFilter + "|" + (seenLevel[recFilter] || "");
  try {
    const before = more && recs.length && !paged() ? recs[recs.length - 1].finished_at : "";
    const at = !more ? 0 : recFilter in SEEN ? seenNext : recFilter === "easy" ? recs.length : 0;
    const res = await api.jobs(recFilter, before, at, seenLevel[recFilter]);
    seenCounts = res.counts || null;
    if (res.counts) { seenNext = at + 48; seenMore = !!res.more; }
    const got = pinThumbs(res.items);
    recs = more ? recs.concat(got) : got;
    recExtended = !!more;
  } catch (e) { toast(e.message); }
  recBusy = false;
  if (asked !== recFilter + "|" + (seenLevel[recFilter] || "")) return loadRecords(false);  // another list was chosen
  recsDrawn = "";
  loadRecords.redraw();
}

loadRecords.redraw = () => {
  const box = $("#records");
  if (!box) return;
  if (box.childElementCount && recsDrawn === recsKey()) return;  // already shows exactly this
  recsDrawn = recsKey();
  box.innerHTML = recordsHtml();
  box.querySelectorAll(".chips button").forEach(b => b.onclick = () => {
    if (b.dataset.l) seenLevel[recFilter] = b.dataset.l; else { recFilter = b.dataset.v; seenCounts = null; }
    box.querySelectorAll(".chips button").forEach(x => x.classList.toggle("on", x.dataset.l ? x.dataset.l === seenLevel[recFilter] : x.dataset.v === recFilter));
    loadRecords(false); });
  box.querySelectorAll(".dcard").forEach(c => c.onclick = () => Number(c.dataset.job) > 0 ? showDetail(c.dataset.job)
    : toast("这张是最早几批标注的，那时还没有保存判断过程"));
  box.querySelectorAll(".quick button").forEach(b => b.onclick = e => { e.stopPropagation(); quickDecide(b); });
  const m = $("#recMore"); if (m) m.onclick = () => loadRecords(true);
};

function detailHtml(d) {
  const j = d.job, r = d.judged ? d.judged.result || {} : null, ex = r ? r.extra || {} : {};
  // what the local model itself named; names Claude added are shown in its own step
  const hits = r ? r.hits || [] : [], cl = ex.claude;
  const items = (ex.vlm_items || []).filter(i => i.by !== "claude" && (i.kind || i.evidence));
  const step = (n, title, body) => `<div class="step"><b class="n">${n}</b><b>${title}</b>${body}</div>`;
  const hitRows = det => hits.filter(h => h.detector === det).map(h =>
    `<tr><td>${esc(h.label.startsWith("unlisted:") ? h.label.slice(9) : nameOf(h.label))}</td>
     <td><span class="pill ${esc(h.verdict)}">${VERDICT[h.verdict] || h.verdict}</span></td>
     <td>${Number(h.score).toFixed(2)}</td><td class="raw">${esc(h.detail || "")}</td></tr>`).join("");
  const table = (head, rows) => rows ? `<table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows}</table>` : `<div class="muted">没有命中</div>`;
  const used = name => { const low = String(name).toLowerCase();
    const h = hits.find(h => h.detector === "vlm" && (h.label.toLowerCase() === "unlisted:" + low || String(h.detail || "").toLowerCase().startsWith(low)));
    return h ? `<span class="pill ${esc(h.verdict)}">${h.label.startsWith("unlisted:") ? "名单外，" : "名单内，"}${VERDICT[h.verdict]}</span>` : `<span class="muted">没有采用</span>`; };
  const ms = k => r && r.timings_ms && r.timings_ms[k] != null ? ` <span class="muted">${(r.timings_ms[k] / 1000).toFixed(1)} 秒</span>` : "";
  let body = "";
  if (j.cached && d.design) body += `<div class="step"><b>这张是重复设计</b>
    <div>它和设计 #${d.design.id} 是同一个图案（这个设计已出现 ${num(d.orders)} 单），所以没有重新检测，直接沿用了那个设计的结论。
    结论来源：${esc(SOURCE[d.design.source] || d.design.source)}。下面是那个设计第一次检测时的判断过程。</div></div>`;
  if (!r) body += `<div class="step"><b>判断过程已过期</b><div class="muted">云端只保留最近 7 天的判断过程，更早的在检测机器本地和 NAS 的存档里。</div></div>`;
  else if (!r.hits && !r.extra) body += `<div class="step"><b>没有保存判断过程</b><div class="muted">这张图是在"保存全部判断过程"功能上线前检测的，当时放行的图不留记录。</div></div>`;
  else {
    body += step(1, "文字识别" + ms("ocr"), `<div class="raw">${esc(ex.ocr_text || "（没有读到文字）")}</div>` + (hitRows("ocr") ? table(["读到的名字", "结论", "分数", "细节"], hitRows("ocr")) : ""));
    body += step(2, "图案检测和图库比对" + ms("owl") + ms("gallery"), table(["像什么", "结论", "分数", "细节"], hitRows("owl") + hitRows("gallery")));
    body += step(3, "本地小模型看图" + ms("vlm"), ex.vlm_skipped ? `<div class="muted">前面已经判了拦截，小模型这一步跳过了。</div>` :
      (items.length ? `<table><tr><th>它认出的东西</th><th>类别</th><th>依据</th><th>把握</th><th>它认为属于</th><th>规则怎么处理</th></tr>${items.map(i =>
        `<tr><td>${esc(i.name)}</td><td>${esc(KIND[i.kind] || i.kind || "")}</td><td>${esc(String(i.evidence || "").split("|").map(e => EVIDENCE[e] || e).join("；"))}</td>
         <td>${i.confidence != null ? Number(i.confidence).toFixed(2) : ""}</td><td>${esc(i.franchise_or_owner || "")}</td><td>${used(i.name)}</td></tr>`).join("")}</table>
         <div class="muted" style="margin-top:6px">"没有采用"的原因是下面之一：把握低于门槛、类别不在送审范围、属于忽略词（国家、节日、订单标签上的字等）。</div>`
        : `<div class="muted">小模型没有认出任何可能是 IP 的东西。</div>`));
    body += step(4, "Claude 复核" + ms("claude"), cl ? `<div>整体判断：<b>${{ ip: "有 IP", not_ip: "没有 IP，放行", unsure: "拿不准，留给人看" }[cl.verdict] || esc(cl.verdict)}</b>
        <span class="muted">（用了 ${num((cl.usage || {}).in)} + ${num((cl.usage || {}).out)} token）</span></div>
        ${(cl.candidates || []).length ? `<table><tr><th>名字</th><th>判断</th><th>权利人</th><th>理由</th></tr>${cl.candidates.map(c =>
          `<tr><td>${esc(c.name)}</td><td>${ISIP[c.is_ip] || esc(c.is_ip)}</td><td>${esc(c.owner)}</td><td>${esc(c.reason)}</td></tr>`).join("")}</table>` : ""}
        ${(cl.other_ip || []).length ? `<div>Claude 另外认出：${cl.other_ip.map(o => esc(o.name) + (o.owner ? `（${esc(o.owner)}）` : "")).join("、")}</div>` : ""}
        ${cl.asked_by ? `<div class="muted">这是在复查页面上手动问的（${esc(cl.asked_by)}），只供参考，没有改动结论。</div>` : ""}
        <div><button class="askbtn" id="askClaude">再让 Sonnet 看一次</button></div>`
      : `<div class="muted">没有发给 Claude。只有"仅因名单外的名字而待确认"的图才会自动发；已拦截的、命中名单的、完全没问题的都不发。</div>
         <div><button class="askbtn" id="askClaude">让 Sonnet 看一下</button> <span class="muted">约 $0.005 一次，计入每天 $10 的额度；它的回答只供你参考，结论还是由你点"侵权 / 放行"。</span></div>`);
  }
  return `<div class="box"><button class="x" id="sheetX" aria-label="关闭">×</button>
    <div class="top"><div>${d.thumb_url ? `<img src="${esc(d.thumb_url)}" alt="">` : `<div class="dcard"><div class="noimg">无缩略图</div></div>`}</div>
    <div><h3><span class="pill ${esc(j.verdict)}">${VERDICT[j.verdict] || ""}</span> ${esc((j.labels || "").split("; ").filter(Boolean).map(nameOf).join("、") || "没有发现问题")}</h3>
      <table><tr><th>文件</th><td class="raw">${esc(j.file_name || "")}</td></tr>
      <tr><th>文件夹</th><td>${esc(j.folder || "")}</td></tr>
      ${d.machine_state ? `<tr><th>当时这台机器</th><td>${esc(stateLine(d.machine_state, d.machine_hw))}${d.machine_state.per_10min != null ? ` · 那 10 分钟检测了 ${num(d.machine_state.per_10min)} 张` : ""}
        <span class="muted">（${hhmm(d.machine_state.at)} 的采样${d.machine_hw && d.machine_hw.gpu ? "，" + esc(d.machine_hw.gpu) : ""}）</span></td></tr>` : ""}
      <tr><th>检测时间</th><td>${new Date(j.finished_at).toLocaleString("zh-CN", { hour12: false })}，机器 ${esc(j.machine || "")}${j.cached ? "，重复设计没有上 GPU" : `，用时 ${Number(j.seconds || 0).toFixed(1)} 秒`}</td></tr>
      ${d.design ? `<tr><th>所属设计</th><td>#${d.design.id}，共 ${num(d.orders)} 单，当前结论：${VERDICT[d.design.verdict]}（${esc(SOURCE[d.design.source] || d.design.source)}）</td></tr>` : ""}
      </table>
      <div class="label">
        <div class="lq">${d.decision ? `已标注：<b>${DECIDED[d.decision.decision] || ""}</b>${d.decision.ip ? "（" + esc(nameOf(d.decision.ip)) + "）" : ""}${d.decision.reviewer_label ? " · " + esc(d.decision.reviewer_label) : ""} · 可以改` : "你的判断：这张图有没有用别人的 IP？"}</div>
        <div class="lbtns">
          <button class="yes" data-d="infringing">侵权<kbd>1</kbd></button>
          <button class="no" data-d="false_positive">放行<kbd>2</kbd></button>
        </div>
        <input id="sheetIp" list="iplist" placeholder="侵权的是哪个 IP（选“是”时填，可以直接写名字）" value="${esc(suggestIp(d))}">
        <div class="muted">标完就关闭，回到列表 · ← → 换图 · Esc 关闭。拿不准的不用标，留着就行。标注对这个设计的所有订单生效，以后再出现直接沿用。</div>
      </div></div></div>
    <h4>判断过程</h4>${body}</div>`;
}

const DECIDED = { infringing: "侵权", false_positive: "放行", unsure: "不确定" };
// What to offer as the IP: the earlier human answer, else what the machines named.
function suggestIp(d) {
  if (d.decision && d.decision.ip) return nameOf(d.decision.ip);
  const first = (d.job.labels || "").split("; ").filter(Boolean)[0] || "";
  return first.startsWith("known:") ? "" : nameOf(first);
}

let sheetJob = null;  // the record the sheet is showing

function closeSheet() { $("#sheet").classList.remove("show"); sheetJob = null; loadRecords.redraw(); }

// The neighbour of the open record in the list on screen (dir: +1 older, -1 newer).
function sheetStep(dir) {
  const list = recsShown(), i = list.findIndex(r => String(r.id) === String(sheetJob));
  const next = i < 0 ? null : list[i + dir];
  if (next) showDetail(next.id); else if (dir > 0) { if (i >= 0) toast("这一页看完了"); closeSheet(); }
}

// Record a person's answer for a finished image. Every card of the same design on screen
// takes it at once: the answer is for the design, whatever order it came in.
async function recordAnswer(id, decision, ip) {
  const res = await api.decideJob(id, decision, ip, $("#reviewer").value.trim() || null);
  toast("已记录：" + DECIDED[decision]);
  const rec = recs.find(r => String(r.id) === String(id));
  for (const r of recs) {
    if (!(r === rec || (rec && rec.design && r.design === rec.design))) continue;
    if (res.verdict) r.verdict = res.verdict;
    if (ip) r.labels = ip;
    r.human = decision;
  }
}

async function sheetDecide(decision) {
  const id = sheetJob, text = ($("#sheetIp") || {}).value || "";
  if (!id) return;
  const ip = decision === "infringing" && text.trim() ? (ipByName[text.trim().toLowerCase()] || text.trim()) : null;
  $("#sheet").querySelectorAll(".lbtns button").forEach(b => { b.disabled = true; });
  try { await recordAnswer(id, decision, ip); }
  catch (e) { alert("保存失败：" + e.message); $("#sheet").querySelectorAll(".lbtns button").forEach(b => { b.disabled = false; }); return; }
  closeSheet();  // back to the list: the reviewer picks the next one, it is not a queue
}

// 侵权 / 放行 right on a card. The IP is what the machines named first (it can be corrected
// in the record); a design that is merely similar to a takedown has no name to offer.
async function quickDecide(button) {
  const card = button.closest(".dcard"), id = card.dataset.job, decision = button.dataset.d;
  const rec = recs.find(r => String(r.id) === String(id));
  const first = ((rec && rec.labels) || "").split("; ").filter(Boolean)[0] || "";
  const ip = decision === "infringing" && first && !first.startsWith("known:") ? first : null;
  card.querySelectorAll(".quick button").forEach(b => { b.disabled = true; });
  try { await recordAnswer(id, decision, ip); }
  catch (e) { alert("保存失败：" + e.message); }
  loadRecords.redraw();
}

// id: a record (job); with ofDesign, a design from "订单最多的设计" - its latest file is shown.
// "让 Sonnet 看一下": the reviewer asks Claude about the image in the sheet. Advice for the
// person labelling; it costs about half a cent and counts against the day's budget.
async function askClaude(button) {
  const id = sheetJob;
  if (!id) return;
  button.disabled = true; button.textContent = "Sonnet 正在看…（几秒钟）";
  try {
    const r = await api.askClaude(id, $("#reviewer").value.trim() || null);
    toast(`Sonnet 已回答 · 这次 $${Number(r.usd).toFixed(4)} · 今天共 $${Number(r.spent).toFixed(2)} / $${r.limit}`);
    if (sheetJob === id) showDetail(id);  // the sheet now shows the answer in step 4
  } catch (e) { alert("没有问成：" + e.message); button.disabled = false; button.textContent = "让 Sonnet 看一下"; }
}

async function showDetail(id, ofDesign) {
  const sheet = $("#sheet");
  sheetJob = id;
  sheet.innerHTML = `<div class="box"><div class="empty">加载中…</div></div>`;
  sheet.classList.add("show");
  try {
    const d = ofDesign ? await api.detailOfDesign(id) : await api.detail(id);
    if (sheetJob !== id) return;
    sheetJob = d.job.id;  // what a label is recorded against
    sheet.innerHTML = detailHtml(d);
  }
  catch (e) { sheet.innerHTML = `<div class="box"><button class="x" id="sheetX">×</button><div class="empty">加载失败：${esc(e.message)}</div></div>`; }
  const x = $("#sheetX"); if (x) x.onclick = closeSheet;
  sheet.querySelectorAll(".lbtns button").forEach(b => { b.onclick = () => sheetDecide(b.dataset.d); });
  const ask = $("#askClaude"); if (ask) ask.onclick = () => askClaude(ask);
  sheet.scrollTop = 0;
}

document.addEventListener("keydown", e => {
  if (!sheetJob || !$("#sheet").classList.contains("show")) return;
  if (e.key === "Escape") { closeSheet(); return; }
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const d = { "1": "infringing", "2": "false_positive" }[e.key];
  if (d) { e.preventDefault(); sheetDecide(d); }
  else if (e.key === "ArrowRight") { e.preventDefault(); sheetStep(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); sheetStep(-1); }
});

let active = false, scanDay = "", lastSeen = "", lastTyped = 0, dashFailed = 0;
const TYPING_GRACE_MS = 6000;
const todayMmdd = () => { const n = new Date(); return String(n.getMonth() + 1).padStart(2, "0") + String(n.getDate()).padStart(2, "0"); };

async function refreshDashboard() {
  if (view !== "dash" || document.hidden) return;
  clearTimeout(pollTimer);
  // Do not redraw under someone typing the date - but only while they are typing: a caret left
  // in the box must not freeze the page.
  const typing = document.activeElement && document.activeElement.id === "scanDay"
    && Date.now() - lastTyped < TYPING_GRACE_MS;
  if (!typing) {
    let data = null;
    try { data = await api.dashboard(); dashFailed = 0; }
    catch (e) {
      // One failed read must not stop the page for good: keep what is shown, say so, try again.
      dashFailed++;
      if (!$("#records")) $("#main").innerHTML = `<div class="empty">加载失败：${esc(e.message)}，正在重试…</div>`;
      else toast("读取失败，稍后自动重试：" + e.message);
      pollTimer = setTimeout(refreshDashboard, Math.min(60000, 5000 * dashFailed));
      return;
    }
    pinThumbs(data.top_designs); pinThumbs(data.recent);
    // The numbers are redrawn every time, the record list is not: its cards (and their pictures)
    // are lifted out and put back, so nothing flickers or reloads under the reader's eyes.
    const kept = $("#records");
    $("#main").innerHTML = dashboardHtml(data);
    const tm = $("#toMachines"); if (tm) tm.onclick = () => setView("machines");
    if (kept && kept.childElementCount) $("#records").replaceWith(kept);
    // Ask for the list only when the newest finished image changed (the numbers already say which).
    const stamp = (data.recent && data.recent[0] ? data.recent[0].id : "") + "";
    if (paged()) {
      // not "newest first": keep the order the reviewer is working down; load it once
      const mark = stamp + "|" + recFilter + (seenLevel[recFilter] || "");
      if (!recs.length && lastSeen !== mark) { lastSeen = mark; await loadRecords(false); }
    } else if ((stamp !== lastSeen || !recs.length) && !$("#sheet").classList.contains("show")) {
      const fresh = pinThumbs((await api.jobs(recFilter, "").catch(() => ({ items: [] }))).items);
      lastSeen = stamp;
      const have = new Set(recs.map(r => r.id));
      recs = fresh.filter(r => !have.has(r.id)).concat(recs);
      if (!recExtended) recs = recs.slice(0, 48);
    }
    loadRecords.redraw();
    document.querySelectorAll(".dgrid .dcard[data-design]").forEach(c => { c.onclick = () => showDetail(c.dataset.design, true); });
    const pz = $("#pauseGo");
    if (pz) pz.onclick = async () => {
      const stop = pz.dataset.paused !== "1";
      if (stop && !confirm("暂停检测？检测机器会把手头已经拿到的图做完（每台最多 32 张），然后停下。排队的图不会丢，点「继续检测」就接着做。")) return;
      pz.disabled = true;
      try { await api.pause(stop, $("#reviewer").value.trim()); toast(stop ? "已暂停" : "已继续"); }
      catch (e) { toast(e.message); }
      refreshDashboard();
    };
    const fl = $("#fleetGo");
    if (fl) fl.onclick = async () => {
      const start = fl.dataset.go !== "1";
      if (start && !confirm("让车间的全部机器一起检测？白天夜里都会工作，机器在打印或生成 PRN 时自己让路；到下一个凌晨 3:00 自动停，之后要再点一次才会开始。随时可以点“让其它机器停下”。")) return;
      fl.disabled = true;
      try { await api.fleet(start, $("#reviewer").value.trim()); toast(start ? "已放行到凌晨 3:00" : "其它机器会把手头的做完后停下"); }
      catch (e) { toast(e.message); }
      refreshDashboard();
    };
    const go = $("#scanGo"), day = $("#scanDay");
    if (day) day.oninput = () => { scanDay = day.value.trim(); lastTyped = Date.now(); };
    if (go) go.onclick = async () => {
      const v = day.value.trim();
      if (!/^\d{4}$/.test(v)) { toast("日期要写成 4 位数字，例如 1005"); return; }
      if (!confirm(`开始检测 ${v.slice(0, 2)}-${v.slice(2)} 文件夹里的全部图片？`)) return;
      go.disabled = true;
      try { await api.scan(v, $("#reviewer").value.trim()); toast("已发出，检测主机几秒内接手"); }
      catch (e) { toast(e.message); }
      refreshDashboard();
    };
  }
  pollTimer = setTimeout(refreshDashboard, active ? 10000 : 60000);
}
// A tab nobody is looking at does not keep asking; it catches up when it is looked at again.
document.addEventListener("visibilitychange", () => {
  if (view !== "dash" && view !== "machines") return;
  clearTimeout(pollTimer);
  if (!document.hidden) (view === "dash" ? refreshDashboard : refreshMachinesPage)();
});

// ---- 设计: every design on a row, to sort, filter, and export with its files' paths -----------
const dz = { sort: "orders", dir: "desc", verdict: "", sonnet: "", local: "", human: "", min: "", q: "",
             offset: 0, rows: [], total: 0, picked: new Map(), busy: false, note: "", got: null };  // got: the last collect request
const DZ_PAGE = 50;
const SAID = { ip: "是 IP", unsure: "拿不准", not_ip: "不是 IP" };
const LOCAL = { listed: "名单内的 IP", unlisted: "名单外的名字", ignored: "认出了，没采用", nothing: "什么都没认出" };
const BY = { human: "人工", takedown: "Temu 下架", claude: "Sonnet", machine: "机器" };
const dzAsk = () => ({ sort: dz.sort, dir: dz.dir, verdict: dz.verdict, sonnet: dz.sonnet, local: dz.local,
                       human: dz.human, min: Number(dz.min) || 0, q: dz.q });
const dayTime = s => s ? new Date(s).toLocaleString("zh-CN", { hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

function designsHtml() {
  const opt = (v, label, now) => `<option value="${v}" ${String(now) === String(v) ? "selected" : ""}>${label}</option>`;
  const pick = (key, label, opts) => `<label>${label}<select data-f="${key}">${opt("", "全部", dz[key])}${Object.entries(opts).map(([v, l]) => opt(v, l, dz[key])).join("")}</select></label>`;
  const th = (key, label) => `<th class="sort ${dz.sort === key ? "by" : ""}" data-s="${key}" title="点一下按它排序，再点一下反过来">${label}${dz.sort === key ? (dz.dir === "desc" ? " ↓" : " ↑") : ""}</th>`;
  const all = dz.rows.length && dz.rows.every(r => dz.picked.has(r.id));
  const row = r => `<tr class="row" data-job="${r.job || ""}">
    <td><input type="checkbox" data-id="${r.id}" ${dz.picked.has(r.id) ? "checked" : ""} aria-label="选中设计 ${r.id}"></td>
    <td>${r.thumb_url ? `<img src="${esc(r.thumb_url)}" loading="lazy" alt="">` : `<div class="noimg"></div>`}</td>
    <td class="name">${esc(r.labels.split("; ").filter(Boolean).map(nameOf).join("、")) || `<span class="muted">没有认出名字</span>`}<div class="muted">#${r.id}</div></td>
    <td><span class="pill ${esc(r.verdict)}">${VERDICT[r.verdict] || ""}</span> <span class="muted">${BY[r.source] || esc(r.source)}</span></td>
    <td>${r.sonnet ? SAID[r.sonnet] || esc(r.sonnet) : `<span class="muted">没问</span>`}</td>
    <td>${r.local ? LOCAL[r.local] || esc(r.local) : `<span class="muted">–</span>`}</td>
    <td class="n"><b>${num(r.orders)}</b></td>
    <td class="wrap">${esc(r.customers.join("、"))}</td>
    <td class="n">${esc(r.days.map(mmdd).join("、"))}</td>
    <td class="n">${dayTime(r.first_at)}</td><td class="n">${dayTime(r.last_at)}</td></tr>`;
  return `<div class="dz">
    <div class="panel"><div class="bar2">
      ${pick("verdict", "结论", { block: "拦截", review: "待确认", pass: "放行" })}
      ${pick("human", "人工标注", { yes: "标过", no: "没标过" })}
      ${pick("sonnet", "Sonnet", { ...SAID, none: "没问过" })}
      ${pick("local", "本地模型", LOCAL)}
      <label>至少 <input type="number" min="1" data-f="min" value="${esc(dz.min)}" placeholder="1"> 单</label>
      <label>名称 <input type="search" data-f="q" value="${esc(dz.q)}" placeholder="如 Disney"></label>
      <span class="muted">${dz.busy ? "读取中…" : `共 <b>${num(dz.total)}</b> 个设计`}</span>
    </div></div>
    <div class="panel"><table><tr><th><input type="checkbox" id="dzAll" ${all ? "checked" : ""} aria-label="选中这一页"></th><th>图</th><th>名称</th><th>结论</th><th>Sonnet</th><th>本地模型</th>
      ${th("orders", "订单数")}<th>客户</th><th>日期</th>${th("first", "第一次出现")}${th("last", "最近一次")}</tr>
      ${dz.rows.map(row).join("") || `<tr><td colspan="11" class="muted">${dz.busy ? "读取中…" : "没有符合条件的设计"}</td></tr>`}</table></div>
    ${collectHtml()}
    <div class="foot">
      <button id="dzPrev" class="quiet" ${dz.offset ? "" : "disabled"}>上一页</button>
      <span class="muted">${dz.total ? `第 ${num(dz.offset + 1)}–${num(Math.min(dz.offset + DZ_PAGE, dz.total))} 个` : ""}</span>
      <button id="dzNext" class="quiet" ${dz.offset + DZ_PAGE < dz.total ? "" : "disabled"}>下一页</button>
      <span style="flex:1"></span>
      <span class="muted">${dz.note || (dz.picked.size ? `已选 ${num(dz.picked.size)} 个设计` : "勾选要找的设计，或直接导出筛选出的全部")}</span>
      <button id="dzOut" class="quiet" ${dz.picked.size ? "" : "disabled"}>导出选中的文件清单</button>
      <button id="dzOutAll" class="quiet" ${dz.total ? "" : "disabled"}>导出筛选出的全部（${num(dz.total)} 个）</button>
    </div></div>`;
}

// One picture per design with the order label cut off, gathered by the host machine in a folder.
const collecting = () => !!(dz.got && (dz.got.status === "queued" || dz.got.status === "working"));
function collectHtml() {
  const g = dz.got, all = dz.total > 0 && dz.total <= 2000;
  const state = !g ? "" : g.status === "queued" ? `已发出，等检测主机接手…（${num(g.total)} 个设计）`
    : g.status === "working" ? `正在收集 <b>${num(g.done)}</b> / ${num(g.total)}…`
    : g.status === "error" ? `上一次没有做完：${esc(g.note || "出错")}`
    : `上一次收集了 <b>${num(g.saved)}</b> 张，在 <b class="path">${esc(g.folder || "")}</b>`
      + (g.unlabelled ? `，其中 ${num(g.unlabelled)} 张没找到标签、整张保存了（清单里标着）` : "")
      + (g.saved < g.total ? `，${num(g.total - g.saved)} 个设计的原文件打不开` : "");
  return `<div class="panel"><div class="bar2">
    <b>收集代表图</b><span class="muted">每个设计一张原图，去掉订单标签和二维码，按订单数从多到少编号，附一份清单</span>
    <span style="flex:1"></span>
    <button id="dzGet" ${dz.picked.size && !collecting() ? "" : "disabled"}>收集选中的 ${num(dz.picked.size)} 个</button>
    <button id="dzGetAll" class="quiet" ${all && !collecting() ? "" : "disabled"} title="${all ? "" : "一次最多 2000 个设计，请先筛选"}">收集筛选出的全部（${num(dz.total)} 个）</button>
  </div>${state ? `<div>${state}</div>` : ""}</div>`;
}
let collectTimer = null;
async function watchCollect() {
  clearTimeout(collectTimer);
  if (view !== "designs") return;
  try { const was = JSON.stringify(dz.got); dz.got = (await api.collects()).requests[0] || null;
    if (was !== JSON.stringify(dz.got)) drawDesigns(); } catch (e) { /* asked again below */ }
  if (collecting()) collectTimer = setTimeout(watchCollect, 4000);
}
async function askCollect(everything) {
  let ids = [...dz.picked.keys()];
  try {
    if (everything) {
      ids = [];
      for (let at = 0; at < dz.total; at += 500) ids = ids.concat((await api.designs({ ...dzAsk(), limit: 500, offset: at, files: true })).items.map(r => r.id));
    }
    dz.got = (await api.collect(ids, $("#reviewer").value.trim() || null)).request;
  } catch (e) { return toast(e.message); }
  drawDesigns(); watchCollect();
}

function drawDesigns() {
  if (view !== "designs") return;
  $("#main").innerHTML = designsHtml();
  const again = () => { dz.offset = 0; loadDesigns(); };
  document.querySelectorAll(".dz [data-f]").forEach(el => el.onchange = () => { dz[el.dataset.f] = el.value.trim(); again(); });
  document.querySelectorAll(".dz th.sort").forEach(h => h.onclick = () => {
    if (dz.sort === h.dataset.s) dz.dir = dz.dir === "desc" ? "asc" : "desc"; else { dz.sort = h.dataset.s; dz.dir = "desc"; }
    again(); });
  document.querySelectorAll(".dz tr.row").forEach(tr => tr.onclick = e => {
    if (e.target.closest("input")) return;
    if (tr.dataset.job) showDetail(tr.dataset.job); });
  document.querySelectorAll(".dz td input[type=checkbox]").forEach(c => c.onchange = () => {
    const r = dz.rows.find(x => String(x.id) === c.dataset.id);
    if (c.checked) dz.picked.set(r.id, r); else dz.picked.delete(r.id);
    dz.note = ""; drawDesigns(); });
  $("#dzAll").onchange = e => { for (const r of dz.rows) { if (e.target.checked) dz.picked.set(r.id, r); else dz.picked.delete(r.id); } dz.note = ""; drawDesigns(); };
  $("#dzPrev").onclick = () => { dz.offset = Math.max(0, dz.offset - DZ_PAGE); loadDesigns(); };
  $("#dzNext").onclick = () => { dz.offset += DZ_PAGE; loadDesigns(); };
  $("#dzGet").onclick = () => askCollect(false);
  $("#dzGetAll").onclick = () => askCollect(true);
  $("#dzOut").onclick = () => exportDesigns(false);
  $("#dzOutAll").onclick = () => exportDesigns(true);
}

let dzAsked = 0;
async function loadDesigns() {
  const mine = ++dzAsked;
  dz.busy = true; drawDesigns();
  try {
    const res = await api.designs({ ...dzAsk(), limit: DZ_PAGE, offset: dz.offset });
    if (mine !== dzAsked) return;  // a newer question is on its way
    dz.rows = pinThumbs(res.items); dz.total = res.total;
  } catch (e) { if (mine === dzAsked) toast(e.message); }
  if (mine !== dzAsked) return;
  dz.busy = false; drawDesigns();
}

// The file list as a spreadsheet: one line per file, with where it is on the NAS.
async function exportDesigns(everything) {
  let rows = [];
  try {
    if (everything) {
      for (let at = 0; at < dz.total && at < 20000; at += 500) {
        dz.note = `正在准备清单… ${num(at)} / ${num(dz.total)}`; drawDesigns();
        rows = rows.concat((await api.designs({ ...dzAsk(), limit: 500, offset: at, files: true })).items);
      }
    } else {
      // the picked designs, wherever in the table they were picked: ask for each one's files
      const ids = [...dz.picked.keys()];
      for (let i = 0; i < ids.length; i += 200) {
        dz.note = `正在准备清单… ${num(i)} / ${num(ids.length)}`; drawDesigns();
        rows = rows.concat((await api.designs({ ids: ids.slice(i, i + 200), files: true, limit: 200, sort: "orders" })).items);
      }
    }
  } catch (e) { dz.note = ""; drawDesigns(); return toast(e.message); }
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["设计编号", "订单数", "名称", "结论", "谁定的", "Sonnet", "本地模型", "客户", "日期", "第几个文件", "文件路径"];
  const lines = [head.map(cell).join(",")];
  let files = 0;
  for (const r of rows) (r.files || []).forEach((f, i) => { files++; lines.push([r.id, r.orders,
    r.labels.split("; ").filter(Boolean).map(nameOf).join("、"), VERDICT[r.verdict] || r.verdict, BY[r.source] || r.source,
    r.sonnet ? SAID[r.sonnet] : "", r.local ? LOCAL[r.local] : "", r.customers.join("、"), r.days.join("、"), i + 1, f].map(cell).join(",")); });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv" }));
  a.download = `LogoGuard-设计文件清单-${todayMmdd()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  dz.note = `已导出 ${num(rows.length)} 个设计、${num(files)} 个文件`; drawDesigns();
}

function setView(v) {
  view = v;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("#q").hidden = v !== "review"; $("#stats").hidden = v !== "review"; $("#reviewer").hidden = v === "dash";
  clearTimeout(pollTimer);
  if (v === "dash") { $("#main").innerHTML = `<div class="empty">加载中…</div>`; refreshDashboard(); }
  else if (v === "designs") { loadDesigns(); watchCollect(); }
  else if (v === "machines") { mView = null; $("#main").innerHTML = `<div class="empty">加载中…</div>`; refreshMachinesPage(); }
  else if (v === "upload") refreshUploads(); else load();
}

$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") e.target.classList.remove("show"); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("#sheet").classList.remove("show");
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const d = { "1":"infringing", "2":"false_positive", "3":"unsure", "ArrowRight":"skip" }[e.key];
  if (d && view === "review" && idx < items.length) { e.preventDefault(); decide(d); }
});
$("#mode").onchange = load;
$("#q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = $("#q").value.trim();
  if (!q) { load(); return; }
  if (q.length < 3) { toast("至少输入 3 个字符"); return; }
  mode = "search"; show(() => api.find(q));
});

(async () => {
  if (REMOTE) {
    $("#mode").hidden = true;  // only flagged images are relayed
    $("#tabs").hidden = false;
    document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setView(b.dataset.view));
  }
  const list = await api.ips().catch(() => []);
  const dl = document.createElement("datalist"); dl.id = "iplist";
  for (const e of list) {
    ips[e.id] = e; ipByName[e.name.toLowerCase()] = e.id;
    const o = document.createElement("option"); o.value = e.name; o.label = e.category; dl.appendChild(o);
  }
  document.body.appendChild(dl);
  stats(); load();
})();
</script></body></html>
