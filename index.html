  const acct = a => `<tr data-act="open" data-id="${a.id}" style="cursor:pointer" class="${az.open === a.id ? "on" : ""}"><td><b>${esc(a.name)}</b>${a.kind === "house" ? ` <span class="muted">自己人</span>` : ""}</td>
    <td>${a.status === "active" ? "在用" : `<span class="warntext">已停用</span>`}</td>
    <td class="n">${a.kind === "house" ? "–" : `<b style="color:${a.low ? "var(--red)" : "inherit"}">${num(a.balance)}</b>${a.low ? " 余额低" : ""}`}</td>
    <td class="n">${num(a.users)}</td><td class="n">${num(a.pictures_24h)}</td><td class="n">${num(a.pictures_30d)}</td><td class="n">${num(a.points_30d)}</td>
    <td class="n">${num(a.bought)}</td><td>${dayTimeOrDash(a.last_topup)}</td><td>${dayTimeOrDash(a.last_used)}</td></tr>`;
  const plan = p => `<tr class="${p.active ? "" : "muted"}"><td>${esc(p.name)}</td><td>${esc(p.price + " " + p.currency)}</td><td>${num(p.points)}</td><td>${num(p.bonus)}</td>
    <td>${num(Number(p.points) + Number(p.bonus))}</td><td>${p.active ? "在卖" : "已下架"}</td>
    <td><button class="quiet" data-act="plan_toggle" data-id="${p.id}">${p.active ? "下架" : "上架"}</button></td></tr>`;
  return `<div><h2>用户与计费 <span class="muted" style="font-weight:400">你是 ${esc(d.me.name)} · 客户先付款给你，你在这里加点数 · 每判断一张图扣一次，同一个客户重复送的图不重复扣</span></h2><div class="tiles">
      ${tile("", num(customers.length), "客户", `${num(customers.filter(a => a.low).length)} 个余额低`)}
      ${tile("blue", num(t.balance), "客户手里还剩的点数")}
      ${tile("", num(t.used_30d), "近 30 天用掉的点数")}
      ${tile("green", (t.money_30d || []).map(m => esc(Number(m.money).toLocaleString() + " " + (m.currency || ""))).join(" · ") || "0", "近 30 天收款", `累计卖出 ${num(t.bought)} 点`)}
    </div></div>
    <div class="panel"><div class="mhead"><h2 style="margin:0">客户</h2><span class="bar2"><input id="azNewName" placeholder="新客户的名字" style="width:160px">
        <label class="muted"><input type="checkbox" id="azNewHouse"> 自己人（不扣点）</label><button data-act="account">新建</button></span></div>
      <table><tr><th>名字</th><th>状态</th><th>余额（点）</th><th>人数</th><th>近 24 小时图片</th><th>近 30 天图片</th><th>近 30 天点数</th><th>累计充值</th><th>最近充值</th><th>最近使用</th></tr>
        ${d.accounts.map(acct).join("") || `<tr><td colspan="10" class="muted">还没有客户。先建一个，再给他加人、充值。</td></tr>`}</table>
      <div class="muted" style="margin-top:6px">点一行看这个客户的人、钥匙、充值和每一笔变动。</div></div>
    ${adminDetailHtml()}
    <div class="two">
      <div class="panel"><h2>计费设置</h2>
        <div class="bar2"><label>一张图扣 <input id="azPpi" type="number" min="0" value="${b.points_per_image}" style="width:70px"> 点</label></div>
        <div class="bar2" style="margin-top:6px"><label>余额不超过 <input id="azLow" type="number" min="0" value="${b.low_balance}" style="width:90px"> 点时提醒</label></div>
        <div class="bar2" style="margin-top:6px"><label>新客户送 <input id="azTrial" type="number" min="0" value="${b.trial_points}" style="width:90px"> 点试用</label></div>
        <div class="bar2" style="margin-top:6px"><label>图片记录保留 <input id="azKeep" type="number" min="1" value="${b.keep_days}" style="width:70px"> 天</label> <span class="muted">（只是记下期限，自动清理还没有做）</span></div>
        <div style="margin-top:8px"><button data-act="billing">保存设置</button> <span class="muted">${b.updated_by ? `上次 ${esc(b.updated_by)} 改于 ${dayTimeOrDash(b.updated_at)}` : ""}</span></div></div>
      <div class="panel"><h2>充值档位（套餐）</h2>
        <table><tr><th>名字</th><th>价格</th><th>点数</th><th>赠送</th><th>到账</th><th>状态</th><th></th></tr>${d.plans.map(plan).join("") || `<tr><td colspan="7" class="muted">还没有档位。没有档位也能充值，自己填点数就行。</td></tr>`}</table>
        <div class="bar2" style="margin-top:10px"><input id="azPlanName" placeholder="名字，如 入门" style="width:110px"><input id="azPlanPrice" type="number" step="0.01" placeholder="价格" style="width:80px">
          <input id="azPlanCurrency" value="CNY" style="width:55px"><input id="azPlanPoints" type="number" placeholder="点数" style="width:90px">
          <input id="azPlanBonus" type="number" placeholder="赠送" style="width:80px"><button data-act="plan">加一档</button></div></div>
    </div>`;
}
async function loadAdmin() {
  if (view !== "admin") return;
  try {
    az.data = await adminCall("overview");
    az.detail = az.open ? await adminCall("account", { id: az.open }) : null;
  } catch (e) { $("#main").innerHTML = `<div class="empty">打不开：${esc(e.message)}<br><button id="azRetry" style="margin-top:10px">重新输入钥匙</button></div>`;
    const r = $("#azRetry"); if (r) r.onclick = loadAdmin; return; }
  if (view !== "admin") return;
  $("#main").innerHTML = adminHtml();
  const pl = $("#azPlan"); if (pl) pl.onchange = () => { const o = pl.selectedOptions[0];
    if (o && o.value) { $("#azPoints").value = o.dataset.points; $("#azMoney").value = o.dataset.price; $("#azCurrency").value = o.dataset.currency; } };
}
function showKey(name, key) {
  $("#sheet").innerHTML = `<div class="box" style="max-width:560px"><h3>${esc(name)} 的钥匙</h3><div class="muted">只显示这一次。复制后发给本人，填进插件的“设置口令”。</div>
    <div class="raw" style="margin:12px 0;font-size:15px;user-select:all;overflow-wrap:anywhere">${esc(key)}</div><button id="azCopyKey">复制</button></div>`;
  $("#sheet").classList.add("show");
  $("#azCopyKey").onclick = () => copy(key, "钥匙");
}
document.addEventListener("click", async e => {
  const b = e.target.closest && e.target.closest("#main [data-act]");
  if (!b || view !== "admin") return;
  const act = b.dataset.act, val = id => { const x = $("#" + id); return x ? x.value.trim() : ""; };
  try {
    if (act === "open") { az.open = az.open === Number(b.dataset.id) ? null : Number(b.dataset.id); }
    else if (act === "close") { az.open = null; }
    else if (act === "account") { const r = await adminCall("account_create", { name: val("azNewName"), kind: $("#azNewHouse").checked ? "house" : "customer" }); az.open = r.id; toast("已新建"); }
    else if (act === "status") { if (!confirm(b.dataset.status === "suspended" ? "停用这个客户？他所有人的钥匙立刻不能用，余额保留。" : "恢复这个客户？")) return;
      await adminCall("account_status", { id: az.open, status: b.dataset.status }); }
    else if (act === "user") { const name = val("azUserName"); const r = await adminCall("user_create", { account: az.open, name, role: val("azUserRole") }); await loadAdmin(); showKey(name, r.key); return; }
    else if (act === "rekey") { if (!confirm("换一把新钥匙？旧钥匙立刻失效。")) return; const r = await adminCall("user_rekey", { user: Number(b.dataset.user) }); await loadAdmin(); showKey("这个人", r.key); return; }
    else if (act === "revoke") { if (!confirm("停用这个人的钥匙？")) return; await adminCall("user_revoke", { user: Number(b.dataset.user) }); }
    else if (act === "topup" || act === "adjust") {
      const points = Number(val("azPoints")); if (!points) { toast("先填点数"); return; }
      if (!confirm(`${act === "topup" ? "充值" : "调整"} ${points} 点？`)) return;
      const r = await adminCall("topup", { account: az.open, points, kind: act, money: act === "topup" ? val("azMoney") : "", currency: val("azCurrency"),
        method: val("azMethod"), plan: act === "topup" ? val("azPlan") : "", note: val("azNote") });
      toast(`已${act === "topup" ? "充值" : "调整"}，余额 ${num(r.balance)} 点`); }
    else if (act === "billing") { await adminCall("billing_save", { points_per_image: val("azPpi"), low_balance: val("azLow"), trial_points: val("azTrial"), keep_days: val("azKeep") }); toast("已保存"); }
    else if (act === "plan") { await adminCall("plan_save", { name: val("azPlanName"), price: val("azPlanPrice"), currency: val("azPlanCurrency"), points: val("azPlanPoints"), bonus: val("azPlanBonus") }); toast("已加一档"); }
    else if (act === "plan_toggle") { const p = az.data.plans.find(x => x.id === Number(b.dataset.id)); await adminCall("plan_save", { ...p, active: !p.active }); }
    else return;
    await loadAdmin();
  } catch (err) { alert("没有做成：" + err.message); }
});

function setView(v) {
  view = v;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
  $("#q").hidden = v !== "review"; $("#stats").hidden = v !== "review"; $("#reviewer").hidden = v === "dash";
  if (v !== "prints") $("#printsNav").hidden = true;
  clearTimeout(pollTimer);
  if (v === "dash") { $("#main").innerHTML = `<div class="empty">加载中…</div>`; refreshDashboard(); }
  else if (v === "designs") { loadDesigns(); watchCollect(); }
  else if (v === "sonnet") { $("#main").innerHTML = `<div class="empty">加载中…</div>`; refreshSonnet(); }
  else if (v === "prints") { $("#main").innerHTML = `<div class="empty">加载中…</div>`; refreshPrints(); }
  else if (v === "admin") { $("#main").innerHTML = `<div class="empty">加载中…</div>`; loadAdmin(); }
  else if (v === "ms") { mz.items = []; $("#main").innerHTML = `<div class="empty">加载中…</div>`; loadMs(); refreshMsLive(); }
  else if (v === "cache") { $("#main").innerHTML = `<div class="empty">加载中…</div>`; refreshCache(); }
  else if (v === "machines") { mView = null; $("#main").innerHTML = `<div class="empty">加载中…</div>`; refreshMachinesPage(); }
  else if (v === "upload") refreshUploads(); else load();
}

$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") e.target.classList.remove("show"); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("#sheet").classList.remove("show");
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const d = { "1":"infringing", "2":"false_positive", "3":"unsure", "ArrowRight":"skip" }[e.key];
  if (d && view === "review" && idx < items.length) { e.preventDefault(); decide(d); }
});
$("#mode").onchange = load;
$("#q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = $("#q").value.trim();
  if (!q) { load(); return; }
  if (q.length < 3) { toast("至少输入 3 个字符"); return; }
  mode = "search"; show(() => api.find(q));
});

(async () => {
  if (REMOTE) {
    $("#mode").hidden = true;  // only flagged images are relayed
    $("#tabs").hidden = false;
    document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => setView(b.dataset.view));
    // "用户与计费" is kept out of sight until there are customers (the owner, 2026-10-08): it shows
    // only when the page is opened with #admin at the end of its address.
    if (location.hash === "#admin") document.querySelector('#tabs [data-view="admin"]').hidden = false;
  }
  const list = await api.ips().catch(() => []);
  const dl = document.createElement("datalist"); dl.id = "iplist";
  for (const e of list) {
    ips[e.id] = e; ipByName[e.name.toLowerCase()] = e.id;
    const o = document.createElement("option"); o.value = e.name; o.label = e.category; dl.appendChild(o);
  }
  document.body.appendChild(dl);
  if (REMOTE) setView(location.hash === "#admin" ? "admin" : "dash"); else { stats(); load(); }
})();
</script></body></html>
