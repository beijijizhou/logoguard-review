<style>
:root { --bg:#f5f5f7; --fg:#1d1d1f; --muted:#6e6e73; --card:#fff; --line:#e3e3e8; --img:#ffffff;
        --red:#c0392b; --red-bg:#fdecea; --green:#1e8449; --green-bg:#e9f7ef; --amber:#9a6700; --amber-bg:#fff4d6;
        --blue:#2471a3; --blue-bg:#eaf2fa; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
        --bg:#161617; --fg:#f5f5f7; --muted:#a1a1a6; --card:#1f1f21; --line:#38383a; --img:#ffffff;
        --red:#ff6b5e; --red-bg:#3a1f1c; --green:#58d68d; --green-bg:#17301f; --amber:#f5b041; --amber-bg:#3a2f14;
        --blue:#5dade2; --blue-bg:#152a3a; } }
:root[data-theme="dark"] { --bg:#161617; --fg:#f5f5f7; --muted:#a1a1a6; --card:#1f1f21; --line:#38383a;
        --red:#ff6b5e; --red-bg:#3a1f1c; --green:#58d68d; --green-bg:#17301f; --amber:#f5b041; --amber-bg:#3a2f14;
        --blue:#5dade2; --blue-bg:#152a3a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
       font:16px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
header { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:12px 20px;
         background:var(--card); border-bottom:1px solid var(--line); }
h1 { font-size:18px; margin:0; }
select, input, button { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line);
         border-radius:8px; padding:6px 10px; }
button { cursor:pointer; }
.muted { color:var(--muted); font-size:14px; }
.spacer { flex:1; }
main { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr); gap:20px;
       max-width:1400px; margin:0 auto; padding:20px; }
.imgbox { background:var(--img); border:1px solid var(--line); border-radius:12px; overflow:hidden;
          display:flex; align-items:center; justify-content:center; min-height:300px; position:relative; }
.imgbox img { display:block; max-width:100%; max-height:calc(100vh - 140px); object-fit:contain; cursor:zoom-in; }
.imgbox .hint { position:absolute; right:10px; bottom:8px; font-size:12px; color:#6e6e73;
                background:rgba(255,255,255,.85); padding:2px 8px; border-radius:6px; }
.panel { display:flex; flex-direction:column; gap:14px; }
.box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
.progress { font-size:14px; color:var(--muted); }
.verdict { font-size:15px; font-weight:600; padding:4px 10px; border-radius:6px; display:inline-block; }
.verdict.block { color:var(--red); background:var(--red-bg); }
.verdict.review { color:var(--amber); background:var(--amber-bg); }
.verdict.pass { color:var(--green); background:var(--green-bg); }
h2 { font-size:15px; margin:12px 0 8px; color:var(--muted); font-weight:500; }
.suspect { border-left:4px solid var(--amber); padding:6px 0 6px 12px; margin:8px 0; }
.suspect.listed { border-color:var(--red); }
.suspect .name { font-size:20px; font-weight:600; overflow-wrap:anywhere; }
.suspect .why { font-size:14px; color:var(--muted); }
.pill { display:inline-block; font-size:12px; padding:1px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; }
.pill.listed { color:var(--red); background:var(--red-bg); }
.pill.unlisted { color:var(--blue); background:var(--blue-bg); }
.question { font-size:17px; font-weight:600; margin:0 0 12px; }
.buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.buttons button { padding:14px 10px; font-size:17px; font-weight:600; border-width:2px; }
.buttons .yes { color:var(--red); border-color:var(--red); }
.buttons .no { color:var(--green); border-color:var(--green); }
.buttons .yes:hover { background:var(--red-bg); } .buttons .no:hover { background:var(--green-bg); }
.buttons .small { font-size:15px; font-weight:500; padding:10px; }
kbd { font:12px ui-monospace,monospace; border:1px solid var(--line); border-radius:4px; padding:0 5px;
      color:var(--muted); margin-left:6px; font-weight:400; }
label.ipl { display:block; font-size:14px; color:var(--muted); margin:14px 0 4px; }
#ip { width:100%; }
details { font-size:13px; color:var(--muted); }
details summary { cursor:pointer; }
details div { overflow-wrap:anywhere; margin-top:6px; }
.left { display:flex; flex-direction:column; gap:10px; min-width:0; }
.idbar { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px;
         display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline; font-size:14px; }
.idbar .k { color:var(--muted); margin-right:4px; }
.idbar .imgid { font:600 18px ui-monospace,Consolas,monospace; letter-spacing:.5px; }
.idbar .file { flex-basis:100%; color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
.link { border:none; background:none; color:var(--blue); padding:0 2px; font-size:13px; cursor:pointer; }
#q { width:260px; max-width:100%; }
.reviewed { font-size:14px; color:var(--blue); background:var(--blue-bg); padding:4px 10px; border-radius:6px; display:inline-block; margin-left:6px; }
.shell { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:start; }
.side { display:flex; flex-direction:column; gap:2px; width:160px; padding:20px 0 20px 14px; position:sticky; top:0; }
.side[hidden] { display:none; }
.side button { text-align:left; border-color:transparent; background:none; color:var(--muted); }
.side button[hidden] { display:none; }
.side button:hover { color:var(--fg); }
.side button.on { border-color:var(--line); background:var(--card); color:var(--fg); font-weight:600; }
.side button.sub { margin-left:14px; font-size:15px; }
@media (max-width:820px) { .shell { grid-template-columns:minmax(0,1fr); }
  .side { flex-direction:row; flex-wrap:wrap; width:auto; position:static; padding:10px 16px 0; }
  .side button.sub { margin-left:0; } }
.side #printsNav { display:flex; flex-direction:column; gap:2px; }
.side #printsNav[hidden] { display:none; }
.side button.sub2 { margin-left:22px; font-size:14px; white-space:nowrap; display:flex; justify-content:space-between; gap:6px; padding-top:5px; padding-bottom:5px; }
.side button.sub2 .n { font-weight:400; font-variant-numeric:tabular-nums; color:var(--muted); }
.prints { gap:16px; }
.phead { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; margin-bottom:12px; }
.phead h3 { margin:0; font-size:16px; font-weight:600; color:var(--fg); }
.phead.top { margin-bottom:0; } .phead.top h2 { margin:0; font-size:24px; font-weight:700; color:var(--fg); letter-spacing:-.3px; }
.phead.top .read { margin-left:auto; font-size:13px; }
.phead.big { margin:6px 0 0; } .phead.big h3 { font-size:20px; } .phead.big b { font-size:20px; font-variant-numeric:tabular-nums; }
.pstack { display:flex; gap:3px; height:28px; }
.pstack button { padding:0; border:0; border-radius:6px; min-width:6px; cursor:pointer; } .pstack button:hover { filter:brightness(.92); }
.plegend { display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:12px; }
.plegend button { display:flex; align-items:baseline; gap:8px; border:0; background:none; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:14px; }
.plegend button:hover, .pbar:hover { background:var(--bg); }
.plegend i { width:10px; height:10px; border-radius:3px; align-self:center; }
.plegend b { font-size:18px; font-variant-numeric:tabular-nums; } .plegend em { font-style:normal; color:var(--muted); font-size:13px; }
.pcols { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; align-items:start; }
.pbig { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px; margin-bottom:16px; }
.pbig b { font-size:44px; line-height:1; letter-spacing:-1px; color:var(--green); font-variant-numeric:tabular-nums; } .pbig span { color:var(--muted); font-size:14px; }
.psub { font-size:13px; color:var(--muted); margin-bottom:4px; }
.pbar { display:grid; grid-template-columns:8.5em minmax(40px,1fr) 3.2em 3.2em; gap:10px; align-items:center; width:100%; border:0; background:none;
        padding:7px 8px; border-radius:8px; cursor:pointer; font-size:14px; text-align:left; }
.pbar .b { height:10px; border-radius:5px; background:var(--bg); overflow:hidden; } .pbar .b i { display:block; height:100%; border-radius:5px; }
.pbar .c { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; } .pbar .p { text-align:right; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
.dash table.ptable th, .dash table.ptable td { text-align:left; padding:9px 12px 9px 0; }
.pnote summary { cursor:pointer; color:var(--muted); font-size:14px; } .pnote p { margin:10px 0 0; font-size:14px; line-height:1.6; color:var(--muted); } .pnote p b { color:var(--fg); font-weight:600; }
.pchips { display:flex; flex-wrap:wrap; gap:8px; }
.pchips button { border-radius:999px; padding:6px 14px; font-size:14px; cursor:pointer; } .pchips button b { font-weight:400; color:var(--muted); margin-left:2px; font-variant-numeric:tabular-nums; }
.pchips button.on { background:var(--fg); color:var(--bg); border-color:var(--fg); } .pchips button.on b { color:inherit; opacity:.7; }
.pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px; } .pgrid.duo { grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); }
.pcard { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.pcard .pics { display:grid; } .pcard.duo .pics { grid-template-columns:1fr 1fr; gap:1px; background:var(--line); }
.pcard img, .pcard .none { display:block; width:100%; aspect-ratio:1; object-fit:contain; background:#fff; } .pcard img.cut { background:#555; }
.pcard .none { display:grid; place-items:center; color:#999; font-size:13px; background:var(--bg); }
.pcard .t { padding:10px 12px 2px; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pcard .s { display:flex; flex-wrap:wrap; gap:2px 10px; padding:0 12px 10px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.pcard .s .tag { color:var(--amber); }
.pmore { display:flex; align-items:center; gap:12px; justify-content:center; padding:8px 0 24px; } .pmore button { padding:8px 22px; border-radius:999px; cursor:pointer; }
.moved { margin:0 0 8px; padding:8px 10px; border-radius:8px; background:var(--amber-bg); font-size:14px; }
/* the record wall's filters */
.filters { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-bottom:12px; }
.filters label { display:flex; gap:6px; align-items:center; font-size:14px; color:var(--muted); }
.filters select { font-size:14px; color:var(--fg); }
.filters select.set { border-color:var(--blue); background:var(--blue-bg); }
.filters .count { margin-left:auto; }
.upwrap { max-width:1100px; margin:0 auto; padding:20px; }
.drop { border:2px dashed var(--line); border-radius:12px; background:var(--card); padding:28px 16px;
        text-align:center; cursor:pointer; }
.drop.over { border-color:var(--blue); background:var(--blue-bg); }
.drop b { font-size:17px; }
.ups { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; margin-top:16px; }
.up { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.up .pic { background:var(--img); min-height:140px; display:flex; align-items:center; justify-content:center;
           color:#6e6e73; font-size:14px; }
.up .pic img { display:block; width:100%; max-height:360px; object-fit:contain; cursor:zoom-in; }
.up .body { padding:12px 14px; font-size:14px; overflow-wrap:anywhere; }
.up .fname { color:var(--muted); font-size:13px; margin-top:6px; }
.up .suspect .name { font-size:16px; }
.empty { grid-column:1/-1; padding:80px 20px; text-align:center; color:var(--muted); font-size:18px; }
.dash { grid-column:1/-1; display:grid; gap:18px; }
.dash h2 { font-size:15px; margin:0 0 8px; color:var(--muted); font-weight:600; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.tile b { display:block; font-size:28px; line-height:1.2; font-variant-numeric:tabular-nums; }
.tile span { color:var(--muted); font-size:13px; }
.tile small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
.tile.red b { color:var(--red); } .tile.amber b { color:var(--amber); } .tile.green b { color:var(--green); }
.tile.blue b { color:var(--blue); }
.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; overflow-x:auto; }
.dash table { border-collapse:collapse; width:100%; font-size:14px; font-variant-numeric:tabular-nums; }
.dash th, .dash td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
.dash th:first-child, .dash td:first-child { text-align:left; }
.dash th { color:var(--muted); font-weight:500; font-size:13px; }
.dash tr:last-child td { border-bottom:0; }
.bar { display:flex; height:8px; border-radius:4px; overflow:hidden; background:var(--line); min-width:120px; }
.bar i { display:block; height:100%; } .bar .b { background:var(--red); } .bar .r { background:var(--amber); }
.bar .p { background:var(--green); }
.dgrid .dcard { cursor:pointer; } .dgrid .dcard:hover { border-color:var(--blue); }
.dgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.dcard { border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:13px; }
.dcard img, .dcard .noimg { display:block; width:100%; height:150px; object-fit:contain; background:var(--img); }
.dcard .noimg { display:grid; place-items:center; color:#999; }
.dcard div { padding:6px 8px; overflow-wrap:anywhere; }
.pill { display:inline-block; padding:1px 7px; border-radius:9px; font-size:12px; }
.pill.idle { background:var(--green-bg); color:var(--green); }
.status { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:14px; }
.status .muted { margin-left:auto; font-size:13px; }
.go { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; font-size:14px; }
.go input { width:5.5em; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px;
            background:var(--card); color:var(--fg); }
.go button { font:inherit; font-weight:600; padding:7px 16px; border-radius:8px; border:0; cursor:pointer;
             background:var(--blue); color:#fff; }
.go button:disabled { opacity:.5; cursor:default; }
.go button.quiet { background:var(--card); color:var(--fg); border:1px solid var(--line); }
.prog { height:14px; border-radius:7px; background:var(--line); overflow:hidden; margin:10px 0 6px; }
.prog i { display:block; height:100%; background:var(--blue); transition:width .6s; }
/* run panel: where the detection stands, at a glance */
.hero { display:grid; gap:14px; padding:18px 20px; }
.hero-top { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
.hero-top b { font-size:16px; }

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KIND = { brand:"品牌", character:"角色", person:"名人 / 真人", music:"歌手 / 乐队 / 歌曲", team:"球队 / 体育",
               media:"电影 / 电视剧 / 游戏 / 书", artwork:"艺术作品", other:"其他" };
const EVIDENCE = { text:"图上写着这个名字", logo:"图上有它的 logo", character:"图上画了这个角色",
                   likeness:"图上的人像是他 / 她", style:"画风和它很像" };
const DETECTOR = { ocr:"图上的文字里读到了它", gallery:"和参考图库里的图很像", owl:"图上有像它 logo 的图案" };
let ips = {}, ipByName = {}, items = [], idx = 0, mode = "flagged";

try { $("#reviewer").value = localStorage.getItem("lg_reviewer") || ""; } catch (e) {}
$("#reviewer").onchange = () => { try { localStorage.setItem("lg_reviewer", $("#reviewer").value); } catch (e) {} };

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1200); }

// Where the image is: order folder (12-digit number in the DTF path), subfolder, file name.
function place(it) {
  const parts = String(it.source || "").split(/[\\/]+/).filter(Boolean);
  const order = parts.find(p => /^\d{9,}$/.test(p)) || "";
  const day = parts.findIndex(p => /^\d{4}$/.test(p));
  return { order, sub: it.client_ref || (day >= 0 ? parts[day + 1] : ""), day: day >= 0 ? parts[day] : "",
           file: parts[parts.length - 1] || "" };
}

function copy(text, what) {
  navigator.clipboard?.writeText(text).then(() => toast("已复制" + what), () => prompt("复制：", text));
}

function evidenceText(ev) {
  const parts = String(ev || "").toLowerCase().split(/[|,/ ]+/).map(p => EVIDENCE[p]).filter(Boolean);
  return [...new Set(parts)].join("；");
}

// One entry per thing the AI suspects, in plain words.
function suspects(it) {
  const vlmItems = it.result.extra?.vlm_items || [];
  const findItem = name => vlmItems.find(i => i.name === name) ||
    vlmItems.find(i => name && String(name).toLowerCase().includes(String(i.name).toLowerCase()));
  const out = [], seen = new Set();
  for (const h of it.result.hits || []) {
    if (h.verdict === "pass") continue;
    const unlisted = h.label.startsWith("unlisted:");
    const key = unlisted ? h.label : h.label;
    if (seen.has(key)) continue; seen.add(key);
    let name, sub = [], ipId = null;
    if (h.label.startsWith("known:")) {
      out.push({ name: "和已下架的图相似", listed: true, tag: "已下架图库", ipId: null, info: "",
                 why: `和 Temu 已下架的一张图（${h.label.slice(6)}）相似度 ${Number(h.score).toFixed(2)}。` +
                      (h.verdict === "block" ? "基本是同一个设计。" : "题材很接近，请确认。") });
    } else if (unlisted) {
      name = h.label.slice(9);
      const vi = findItem(name);
      if (vi?.kind) sub.push(KIND[vi.kind] || vi.kind);
      if (vi?.franchise_or_owner && vi.franchise_or_owner !== name) sub.push("属于 " + vi.franchise_or_owner);
      const why = h.detector === "vlm" ? evidenceText(vi?.evidence) : DETECTOR[h.detector];
      out.push({ name, listed:false, ipId:null, info: sub.join(" · "),
                 why: "AI 看图认出了它" + (why ? "：" + why : "") + "。不在 Temu 名单里，需要你判断算不算侵权。" });
    } else {
      const e = ips[h.label]; ipId = h.label; name = e?.name || h.label;
      const vi = h.detector === "vlm" ? findItem(String(h.detail || "").split(" (")[0]) : null;
      const why = h.detector === "vlm" ? "AI 看图认出了它" + (evidenceText(vi?.evidence) ? "：" + evidenceText(vi.evidence) : "")
                                       : DETECTOR[h.detector] || h.detector;
      out.push({ name, listed:true, ipId, info: e?.category || "", why: why + "。" });
    }
  }
  return out;
}

// Both backends give items in this shape:
// {key, imgId, thumb, full, verdict, orders, suspects:[{name, listed, ipId, info, why}],
//  place:{order, folder, file}, path, seen, hits, reviewed}
function fromLocal(it) {
  const pl = place(it);
  return { key: it.id, imgId: String(it.sha256 || "").slice(0, 8), thumb: `/jobs/${it.id}/thumb?size=1200`,
           full: `/jobs/${it.id}/image`, verdict: it.verdict, orders: it.orders, suspects: suspects(it),
           place: { order: pl.order, folder: [pl.day, pl.sub].filter(Boolean).join(" / "), file: pl.file },
           path: it.source, seen: (it.result.extra?.vlm_items || []).map(i => i.name).join("、"),
           hits: (it.result.hits || []).map(h => `${h.detector}:${h.label}(${h.verdict})`).join("，"),
           reviewed: it.reviewed || null };
}
function fromRemote(it) {
  return { key: it.image_id, imgId: String(it.image_id).slice(0, 8), thumb: it.thumb_url, full: it.thumb_url,
           priority: it.priority || 0, claude: it.claude || null,
           verdict: it.ai_verdict, orders: it.orders,
           suspects: (it.suspects || []).map(s => ({ name: s.name, listed: s.listed, tag: s.tag, ipId: s.ip_id, why: s.why,
             info: [s.kind, s.owner && s.owner !== s.name ? "属于 " + s.owner : ""].filter(Boolean).join(" · ") })),
           place: { order: it.order_no || "", folder: it.folder || "", file: it.file_name || "" },
           path: null, seen: (it.vlm_items || []).map(i => i.name).join("、"), hits: "", reviewed: it.reviewed || null };
}

// Review priority, set by the machine that flagged the image: what to look at first.
const PRIO = { 1: "机器已拦截", 2: "Claude 确认是 IP", 3: "命中名单 / 像已下架图", 4: "Claude 拿不准", 5: "只有小模型认出" };
let prioFilter = 0, prioCounts = null;  // 0 = every level
function prioBar() {
  if (!prioCounts) return "";
  const total = Object.values(prioCounts).reduce((a, b) => a + b, 0);
  const chip = (n, label, count) => `<button data-p="${n}" class="${prioFilter === n ? "on" : ""}" ${count ? "" : "disabled"}>${label} <b>${count}</b></button>`;
  return `<div class="prios"><span class="muted">待复查，按优先级：</span>${chip(0, "全部", total)}${[1, 2, 3, 4, 5].map(n => chip(n, `${n} 级`, prioCounts[n] || 0)).join("")}</div>`;
}

const REMOTE = window.LG_REMOTE || null;  // set in the static page built by remote_page()
const api = REMOTE ? {
  async call(body) {
    const r = await fetch(REMOTE.url, { method: "POST", body: JSON.stringify(body),
      headers: { "Content-Type": "application/json", "x-lg-passcode": passcode() } });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { forgetPasscode(); throw new Error("口令错误，请刷新页面重新输入"); }
    if (!r.ok) throw new Error(j.error || r.status);
    return j;
  },
  async queue() {
    const r = await this.call({ action: "queue", limit: 60, priority: prioFilter });
    prioCounts = r.levels || null;
    return r.items.map(fromRemote);
  },
  async find(q) { return (await this.call({ action: "find", q })).items.map(fromRemote); },
  async decide(it, decision, ip, reviewer) {
    await this.call({ action: "decide", image_id: it.key, decision, ip, reviewer_label: reviewer });
  },
  stats() { return this.call({ action: "stats" }); },
  dashboard() { return this.call({ action: "dashboard", days: 14 }); },
  platforms() { return this.call({ action: "platforms", days: 3 }); },
  msItems(level, owner, offset) { return this.call({ action: "ms_items", level, owner, offset, limit: 48 }); },
  msIds(level, owner) { return this.call({ action: "ms_ids", level, owner }); },
  msLive() { return this.call({ action: "ms_live" }); },
  msDecide(url, decision, ip, reviewer) { return this.call({ action: "ms_decide", url, decision, ip, reviewer_label: reviewer }); },
  platformOrders(day, platform, verdict) { return this.call({ action: "platform_orders", day, platform, verdict }); },
  scan(day, reviewer) { return this.call({ action: "scan", day, reviewer_label: reviewer }); },
  pause(paused, reviewer) { return this.call({ action: "pause", paused, reviewer_label: reviewer }); },
  fleet(go, reviewer) { return this.call({ action: "fleet", go, reviewer_label: reviewer }); },
  jobs(verdict, before, offset, level) { return this.call({ action: "jobs", verdict, before, offset, level, limit: 48 }); },
  askClaudeImage(imageId, reviewer) { return this.call({ action: "ask_claude", image_id: imageId, reviewer_label: reviewer }); },
  detail(id) { return this.call({ action: "detail", id: Number(id) }); },
  cache() { return this.call({ action: "cache", days: 14 }); },
  sonnet() { return this.call({ action: "sonnet" }); },
  prints() { return this.call({ action: "prints" }); },
  printsRows(kind, why, offset) { return this.call({ action: "prints_rows", kind, why, offset }); },
  sonnetRule(n) { return this.call({ action: "sonnet_rule", min_orders: n }); },
  machines(since) { return this.call({ action: "machines", since }); },
  machine(machine, since, hours) { return this.call({ action: "machine", machine, since, hours }); },
  machinePause(machine, paused, reviewer) { return this.call({ action: "machine_pause", machine, paused, reviewer_label: reviewer }); },
  requeueErrors(reviewer) { return this.call({ action: "requeue_errors", reviewer_label: reviewer }); },
  command(machine, what, reviewer) { return this.call({ action: "command", machine, do: what, reviewer_label: reviewer }); },
  askClaude(id, reviewer) { return this.call({ action: "ask_claude", job_id: Number(id), reviewer_label: reviewer }); },
  detailOfDesign(id) { return this.call({ action: "detail", design: Number(id) }); },
  designs(ask) { return this.call({ action: "designs", ...ask }); },
  collect(ids, reviewer) { return this.call({ action: "collect", ids, reviewer }); },
  collects() { return this.call({ action: "collects" }); },
  decideJob(id, decision, ip, reviewer) {
    return this.call({ action: "decide_job", job_id: Number(id), decision, ip, reviewer_label: reviewer });
  },
  async ips() { return REMOTE.ips || []; },
} : {
  async queue(m) { return (await (await fetch(`/review/items?mode=${m}&limit=60`)).json()).map(fromLocal); },
  async find(q) { return (await (await fetch(`/review/find?q=${encodeURIComponent(q)}`)).json()).map(fromLocal); },
  async decide(it, decision, ip, reviewer) {
    const r = await fetch(`/jobs/${it.key}/review`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision, ip_id: ip, reviewer }) });
    if (!r.ok) throw new Error(await r.text());
  },
  async stats() { return (await fetch("/review/stats")).json(); },
  async ips() { return (await fetch("/review/ips")).json(); },
};

function passcode() {
  let p = null;
  try { p = localStorage.getItem("lg_passcode"); } catch (e) {}
  if (!p) { p = prompt("请输入复查口令") || ""; try { localStorage.setItem("lg_passcode", p); } catch (e) {} }
  return p;
}
function forgetPasscode() { try { localStorage.removeItem("lg_passcode"); } catch (e) {} }

function render() {
  if (view !== "review") return;
  const main = $("#main");
  if (idx >= items.length) {
    main.innerHTML = `<div class="empty">${mode === "search" ? "" : prioBar()}${mode === "search" ? (items.length ? "搜索结果看完了。" : "没找到这张图。") :
      items.length ? "这一批看完了。" : (mode === "pass" ? "没有可抽查的图。" : "没有待复查的图。")}
      <br><br><button id="more">再加载一批</button></div>`;
    $("#more").onclick = load;
    main.querySelectorAll(".prios button").forEach(b => { b.onclick = () => { prioFilter = Number(b.dataset.p); load(); }; });
    return;
  }
  const it = items[idx], sus = it.suspects;
  const verdict = { block:["block","AI 判定：拦截"], review:["review","AI 判定：需要人看"], pass:["pass","AI 判定：放行"] }[it.verdict]
                  || ["review", it.verdict];
  const susHtml = sus.length ? sus.map(s => `
      <div class="suspect ${s.listed ? "listed" : ""}">
        <div class="name">${esc(s.name)}<span class="pill ${s.listed ? "listed" : "unlisted"}">${esc(s.tag || (s.listed ? "Temu 名单内" : "名单外"))}</span></div>
        ${s.info ? `<div class="why">${esc(s.info)}</div>` : ""}
        <div class="why">${esc(s.why)}</div>
      </div>`).join("")
    : `<div class="why muted">${mode === "pass" ? "AI 没发现问题。请检查是否漏掉了品牌、角色、名人或作品。" : "（没有具体命中）"}</div>`;
  const question = mode === "pass" ? "这张图有没有用到别人的品牌、角色、名人或作品？"
    : sus.length === 1 ? `这张图是否用了「${esc(sus[0].name)}」或其他人的 IP？` : "这张图是否用了上面的 IP，或其他人的 IP？";
  const pl = it.place;
  const reviewed = it.reviewed ? { infringing:"侵权", false_positive:"没问题", unsure:"不确定" }[it.reviewed] : "";
  main.innerHTML = `
    <div class="left">
      <div class="imgbox">
        <img id="img" src="${esc(it.thumb)}" alt="待复查的设计图">
        <span class="hint">点图片看原图</span>
      </div>
      <div class="idbar">
        <span><span class="k">图片编号</span><span class="imgid">${esc(it.imgId)}</span>

// Signed image links expire. When one fails, fetch the list again and keep the reviewer on the
// same image; at most once a minute, so a truly missing image cannot cause a reload loop.
let lastLinkRefresh = 0;
async function refreshLinks(key) {
  if (!REMOTE || Date.now() - lastLinkRefresh < 60000) return;
  lastLinkRefresh = Date.now();
  try {
    const q = $("#q").value.trim();
    const fresh = mode === "search" && q.length >= 3 ? await api.find(q) : await api.queue(mode);
    const byKey = new Map(fresh.map(f => [f.key, f]));
    items = items.map(i => byKey.has(i.key) ? { ...i, thumb: byKey.get(i.key).thumb, full: byKey.get(i.key).full } : i);
    if (items[idx]?.key === key) render();
  } catch (e) { toast("图片链接刷新失败：" + e.message); }
}

async function decide(d) {
  if (d === "skip") { idx++; render(); return; }
  const it = items[idx], text = $("#ip").value.trim();
  const ip = d === "infringing" && text ? (ipByName[text.toLowerCase()] || text) : null;
  try { await api.decide(it, d, ip, $("#reviewer").value || null); }
  catch (e) { alert("保存失败：" + e.message); return; }
  toast({ infringing:"已记录：侵权", false_positive:"已记录：没问题", unsure:"已记录：不确定" }[d]);
  idx++; render(); stats();
}

async function stats() {
  try {
    const s = await api.stats();
    $("#stats").textContent = `已复查 ${s.total} 张：侵权 ${s.infringing || 0} · 没问题 ${s.false_positive || 0} · 不确定 ${s.unsure || 0}`;
  } catch (e) { $("#stats").textContent = ""; }
}

async function show(loader) {
  $("#main").innerHTML = `<div class="empty">加载中…</div>`;

  catch (e) { $("#main").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; return; }
  idx = 0; render();
}

function load() { mode = $("#mode").value; return show(() => api.queue(mode)); }

// ---- upload an image and let the GPU machine analyse it (remote page only) ----------------
const MAX_SIDE = 2048, SEND_AS_IS = 6 * 1024 * 1024;
let view = "review", ups = [], sending = [], pollTimer = null;

// Downsize in the browser so a 50 MB print file does not cross the ocean. PNG / WEBP stay PNG
// to keep transparency (the detector picks a contrasting background for white-ink designs).
async function prepare(file) {
  let bmp;
  try { bmp = await createImageBitmap(file); } catch (e) { return file; }
  const scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  if (scale === 1 && file.size <= SEND_AS_IS) return file;
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const type = file.type === "image/jpeg" ? "image/jpeg" : "image/png";
  return await new Promise(r => c.toBlob(b => r(b || file), type, 0.92));
}

async function sendFile(file) {
  const entry = { name: file.name, state: "正在缩小…" };
  sending.unshift(entry); renderUploads();
  try {
    const blob = await prepare(file), type = blob.type || file.type;
    entry.state = `正在上传（${(blob.size / 1024 / 1024).toFixed(1)} MB）…`; renderUploads();
    const start = await api.call({ action: "upload_start", content_type: type });
    const put = await fetch(start.upload_url, { method: "PUT", headers: { "Content-Type": type }, body: blob });
    if (!put.ok) throw new Error("上传失败 " + put.status);
    await api.call({ action: "upload_done", path: start.path, file_name: file.name,
                     submitted_by: $("#reviewer").value || null });
    sending.splice(sending.indexOf(entry), 1);
  } catch (e) { entry.state = "失败：" + e.message; entry.failed = true; }
  await refreshUploads();
}

async function refreshUploads() {
  try { ups = (await api.call({ action: "uploads", limit: 30 })).items; } catch (e) { toast(e.message); }
  renderUploads();
  clearTimeout(pollTimer);
  const waiting = ups.some(u => u.status === "queued" || u.status === "running") || sending.some(x => !x.failed);
  if (view === "upload" && waiting) pollTimer = setTimeout(refreshUploads, 3000);
}

function uploadCard(u) {
  const v = { block: ["block", "拦截"], review: ["review", "需要人看"], pass: ["pass", "放行（没发现问题）"] }[u.verdict];
  const wait = u.status === "queued" ? "排队中，等 GPU 电脑领取…" : u.status === "running" ? "检测中…" : "";
  const sus = (u.suspects || []).map(s => `
      <div class="suspect ${s.listed ? "listed" : ""}">
        <div class="name">${esc(s.name)}<span class="pill ${s.listed ? "listed" : "unlisted"}">${esc(s.tag || (s.listed ? "Temu 名单内" : "名单外"))}</span></div>
        <div class="why">${esc([s.kind, s.owner && s.owner !== s.name ? "属于 " + s.owner : ""].filter(Boolean).join(" · "))}</div>
        <div class="why">${esc(s.why)}</div>
      </div>`).join("");
  const seen = (u.vlm_items || []).map(i => i.name).join("、");
  return `<div class="up">
    <div class="pic">${u.thumb_url ? `<img src="${esc(u.thumb_url)}" alt="" onclick="window.open(this.src,'_blank')" onerror="uploadLinkFailed()">` : esc(wait || "没有缩略图")}</div>
    <div class="body">
      ${u.status === "error" ? `<span class="verdict block">出错</span><div class="why">${esc(u.error || "")}</div>`
        : v ? `<span class="verdict ${v[0]}">${v[1]}</span>${u.seconds ? ` <span class="muted">${u.seconds} 秒</span>` : ""}`
        : `<span class="verdict review">${esc(wait)}</span>`}
      ${sus}
      ${u.status === "done" && seen ? `<div class="why">AI 在图上看到：${esc(seen)}</div>` : ""}
      <div class="fname">${esc(u.file_name || "")}${u.image_id ? " · 图片编号 " + esc(String(u.image_id).slice(0, 8)) : ""}</div>
    </div></div>`;
}

let lastUploadLinkRefresh = 0;
function uploadLinkFailed() {
  if (Date.now() - lastUploadLinkRefresh < 60000) return;
  lastUploadLinkRefresh = Date.now();
  refreshUploads();
}

function renderUploads() {
  if (view !== "upload") return;
  const pending = sending.map(x => `<div class="up"><div class="pic">${esc(x.state)}</div>
      <div class="body"><div class="fname">${esc(x.name)}</div></div></div>`).join("");
  $("#main").className = "";
  $("#main").innerHTML = `<div class="upwrap" style="grid-column:1/-1">
    <div class="drop" id="drop"><b>点这里选择图片，或把图片拖进来</b>
      <div class="muted">PNG / JPG / WEBP，可多选。大图会先在浏览器里缩小到 ${MAX_SIDE} 像素再上传。结果一般十几秒内出来。</div>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></div>
    <div class="ups">${pending}${ups.map(uploadCard).join("") || (pending ? "" : `<div class="empty">还没有上传过图片</div>`)}</div>
  </div>`;
  const drop = $("#drop"), input = $("#file");
  const add = files => [...files].filter(f => /^image\/(png|jpeg|webp)$/.test(f.type)).forEach(sendFile);
  drop.onclick = () => input.click();
  input.onchange = () => add(input.files);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };
}

// ---- the machines page: every machine side by side, and one machine in full ------------------
// machinesData: the comparison table. mView: the machine shown on its own page (null = the table).
let machinesData = null, machinesMeta = { latest: null, hosts: [] }, mView = null, mHours = 6, mData = null, mFailed = 0;
const DO = { status: "查询状态", stop: "停止并释放显卡", start: "启动检测程序", restart: "重启检测程序", update: "更新到最新版" };
// "today" is the reader's own day: output is counted from their midnight
const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.toISOString(); };
const gb = mb => (Number(mb) / 1024).toFixed(1);
const channelOn = m => !!(m.channel && Date.now() - new Date(m.channel.seen_at) < 60000);
// What the machine is doing, in one word. The worker reports once a minute, the channel every 10 s.
function mState(m) {
  const s = m.status || {}, online = m.last_seen && Date.now() - new Date(m.last_seen) < 180000;
  if (!online) return { key: "off", dot: "paused", text: channelOn(m) ? "检测程序没在运行" : "离线" };
  if (m.paused) return { key: "paused", dot: "paused", text: m.paused_reason ? "出错，已自动停下" : "已暂停" };
  if (s.loaded && s.per_10min > 0) return { key: "work", dot: "live", text: "正在检测" };
  return { key: "idle", dot: "", text: s.loaded ? "在线，等任务" : "在线，模型未加载" };
}
// The freshest load figures there are: the channel's (10 s) when it is connected, else the worker's (1 min).
function mLive(m) {
  const s = m.status || {}, i = channelOn(m) ? m.channel.info || {} : {}, hw = m.hw || {};
  return { cpu: i.cpu ?? s.cpu, ram: s.ram, gpu: i.gpu ?? s.gpu, vram: i.vram_mb ?? s.vram_used_mb,
           vramTotal: i.vram_total_mb ?? hw.vram_mb, temp: i.temp ?? s.temp, power: s.power_w,
           fresh: channelOn(m) ? "通道 10 秒一次" : "检测程序每分钟一次" };
}
// Live line from MachineChannel's agent (every 10 s, whether LogoGuard runs or not).
function channelLine(m) {
  const c = m.channel;
  if (!c) return `<span class="muted">通道还没装到这台机器上：只能看到检测程序自己每分钟上报的状态，发不了停止 / 启动指令</span>`;
  const i = c.info || {};
  if (!channelOn(m)) return `<span class="pill block">通道连不上</span> <span class="muted">${ago(c.seen_at)}还在 · 机器可能关了</span>`;
  return `<span class="pill idle">通道在线</span> <span class="muted">版本 ${esc(String(i.agent || "").slice(0, 7))}</span>`
    + ((i.running || []).includes("logoguard") ? ` · <b>正在执行指令</b>` : "");
}
function commandSaid(c) {
  try { const r = JSON.parse(c.reply);

      return Object.keys(H).map(k => `${H[k]}${r.host[k] ? "在运行" : "已停止"}`).join(" · ") + (r.task === "Disabled" ? " · 自动拉起已关闭" : ""); }
    return r.ok === false ? r.error : r.worker ? `检测程序${r.worker === "running" ? "在运行" : "已停止"}` + (r.busy ? `，机器正在${r.busy === "rip" ? "排版" : "打印"}` : "") : r.updated ? "已更新" : ""; }
  catch (e) { return (c.reply || "").slice(-120); }
}
const CMD_STATE = { queued: "已发出，等机器接收", delivered: "机器正在执行", done: "完成", error: "没有成功", expired: "机器没有接收，已作废" };
function machineButtons(m) {

const hwLine = hw => !hw ? "" : [hw.cpu ? `${hw.cpu}${hw.cores ? `（${hw.cores} 核 ${hw.threads || ""} 线程）` : ""}` : "",
  hw.ram_gb ? `内存 ${hw.ram_gb} GB` : "", hw.gpu ? `${hw.gpu}${hw.vram_mb ? ` ${gb(hw.vram_mb)} GB` : ""}` : "",

// how long the host's daily routine has been silent, in words; "" while it is alive (it stamps every 30 s)

// Every machine side by side: who is working, how hard, how fast, and what it produced today.

    <td style="white-space:normal;text-align:left">${esc(e.detail || "")}</td><td>${esc(e.by || (e.event === "auto_paused" ? "系统自动" : ""))}</td></tr>`;

// One value over time. x follows the clock, so a machine that was off shows as a gap, not a jump.
function chartHtml(load, key, title, unit, opt = {}) {
  const span = mHours * 3600000, t1 = Date.now(), t0 = t1 - span, step = Math.max(1, Math.ceil(mHours * 60 / 360)) * 60000;
  const val = h => h[key] == null ? null : Number(h[key]) * (opt.scale || 1);
  const pts = (load || []).map(h => ({ t: new Date(h.at).getTime(), v: val(h) })).filter(p => p.v != null && p.t >= t0);
  const fmt = v => opt.digits ? v.toFixed(opt.digits) : Math.round(v);
  if (!pts.length) return `<div class="chart"><div class="ct">${title}<span>这段时间没有数据</span></div><svg viewBox="0 0 300 84"></svg></div>`;
  const top = Math.max(opt.max || 0, ...pts.map(p => p.v)) || 1, W = 300, H = 84;
  const segs = [[]];
  pts.forEach((p, i) => { if (i && p.t - pts[i - 1].t > step * 2.5) segs.push([]); segs[segs.length - 1].push(p); });
  const xy = p => `${((p.t - t0) / span * W).toFixed(1)},${(H - 4 - p.v / top * (H - 10)).toFixed(1)}`;
  // a lone sample would draw nothing: give it a little width
  const lines = segs.map(g => `<polyline points="${g.length > 1 ? g.map(xy).join(" ") : xy(g[0]) + " " + xy({ t: g[0].t + step, v: g[0].v })}"/>`).join("");
  const avg = pts.reduce((a, p) => a + p.v, 0) / pts.length, peak = Math.max(...pts.map(p => p.v)), last = pts[pts.length - 1];
  const stale = t1 - last.t > step * 3;
  const clock = t => new Date(t).toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit" });
  return `<div class="chart"><div class="ct">${title} <b>${stale ? "–" : fmt(last.v)}</b>${unit}<span>平均 ${fmt(avg)} · 最高 ${fmt(peak)} · 刻度顶 ${fmt(top)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${title}，最近 ${mHours} 小时">
      <line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}"/>${lines}</svg>
    <div class="cx"><span>${clock(t0)}</span><span>${clock(t0 + span / 2)}</span><span>${clock(t1)}</span></div></div>`;
}

// Output hour by hour over the last 24 hours, on the reader's clock.
function hoursHtml(rows) {
  const by = new Map((rows || []).map(r => [new Date(r.hour).getTime(), r]));
  const end = new Date(); end.setMinutes(0, 0, 0);
  const hours = Array.from({ length: 24 }, (_, i) => { const t = end.getTime() - (23 - i) * 3600000; return { t, ...(by.get(t) || {}) }; });
  const top = Math.max(1, ...hours.map(h => Number(h.analysed || 0) + Number(h.repeats || 0)));
  const bar = h => { const a = Number(h.analysed || 0), r = Number(h.repeats || 0), hh = new Date(h.t).getHours();
    return `<div class="hb" title="${hh}:00–${hh}:59  上显卡 ${a} 张 · 重复沿用 ${r} 张 · 标出 ${Number(h.flagged || 0)} 张${h.errors ? " · 出错 " + h.errors : ""}">
      <i class="rp" style="height:${r / top * 100}%"></i><i style="height:${a / top * 100}%"></i></div>`; };
  return `<div class="hbars">${hours.map(bar).join("")}</div>
    <div class="hlabels">${hours.map(h => `<span>${new Date(h.t).getHours()}</span>`).join("")}</div>
    <div class="hkey">最高的一小时 ${num(top)} 张<i></i>上显卡检测<i class="rp"></i>重复设计沿用 · 鼠标放在柱子上看那一小时的数字</div>`;
}

function mRecentCard(x) {
  const names = (x.labels || "").split("; ").filter(Boolean).map(nameOf).join("、");
  if (x.status === "error") return `<div class="dcard err" title="${esc(x.error || "")}"><div class="noimg">出错</div>
    <div class="cap"><div class="what">${esc((x.error || "").slice(0, 60))}</div><div class="when">${hhmm(x.finished_at)} · ${esc(x.file_name || "")}</div></div></div>`;
  return `<div class="dcard ${esc(x.verdict)}" data-job="${x.id}" title="${esc(x.file_name || "")}">
    ${x.thumb_url ? `<img src="${esc(x.thumb_url)}" loading="lazy" alt="">` : `<div class="noimg">无缩略图</div>`}
    <span class="badge ${esc(x.verdict)}">${VERDICT[x.verdict] || ""}</span>${x.cached ? `<span class="rep">重复</span>` : ""}
    <div class="cap"><div class="what ${names ? "" : "none"}">${esc(names) || (x.verdict === "pass" ? "没有发现问题" : "")}</div>
      <div class="when">${hhmm(x.finished_at)} · ${x.cached ? "沿用，没上显卡" : Number(x.seconds || 0).toFixed(1) + " 秒"}</div></div></div>`;
}

// One machine in full: live figures, load over time, what it holds, what it produced.
function machineHtml(d) {
  const st = mState(d), l = mLive(d), s = d.status || {}, f = d.figures || {}, off = st.key === "off";
  const tile = (cls, value, label, note) => `<div class="tile ${cls}"><b>${value}</b><span>${label}</span>${note ? `<small>${note}</small>` : ""}</div>`;
  const live = (v, unit, label, note, cls = "") => tile(cls, off || v == null ? "–" : v + `<span style="font-size:15px"> ${unit}</span>`, label, note);
  const held = d.holding || [], oldest = held[0] ? Math.round((Date.now() - new Date(held[0].claimed_at)) / 60000) : 0;
  // why it is, or is not, being handed work right now
  const why = off ? (channelOn(d) ? "机器开着，但检测程序没在运行：点“启动”让它开始" : "机器离线，或者检测程序没在运行")

  const again = () => refreshMachinesPage();
  box.querySelectorAll("tr[data-machine]").forEach(r => r.onclick = () => openMachine(r.dataset.machine));
  const back = $("#mBack"); if (back) back.onclick = () => openMachine(null);
  box.querySelectorAll("#mRange button").forEach(b => b.onclick = () => { mHours = Number(b.dataset.h); again(); });
  box.querySelectorAll("#mRecent .dcard[data-job]").forEach(c => c.onclick = () => showDetail(c.dataset.job));
  box.querySelectorAll("button[data-pause]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api.machinePause(b.dataset.m, b.dataset.pause === "1", who()); toast(b.dataset.pause === "1" ? `${b.dataset.m} 已暂停` : `${b.dataset.m} 已恢复`); }

  box.querySelectorAll("button[data-do]").forEach(b => b.onclick = async () => {

      ? `停止检测主机 ${m} 上的三个程序（检测、同步、日常）？停了之后新的图不会进队列、报告不会更新、页面的“开始检测”没人接，直到你点“启动”。`
      : `停止 ${m} 上的检测程序？它会立刻结束并把显卡让出来，手头没做完的图会回到队列。之后要点"启动"它才会再工作。`)) return;
    b.disabled = true;
    try { const r = await api.command(m, what, who());
      toast(`已通过通道发给 ${m}：${DO[what]}` + (r.via === "direct" ? "（项目钥匙没用上，走了备用路径，指令照常送达）" : "")); }
    catch (e) { toast(e.message); }
    setTimeout(again, 4000);
  });
  const rq = $("#requeueErrors");
  if (rq) rq.onclick = async () => {
    if (!confirm("把最近 24 小时出错的图放回队列？原因（NAS、坏掉的机器）解决之后再点；没解决的话它们会再出错一次，然后留在“出错”里。")) return;
    rq.disabled = true;
    try { const r = await api.requeueErrors(who()); toast(`已把 ${r.requeued} 张放回队列`); } catch (e) { toast(e.message); }
    again();
  };
  const all = $("#updateAll");
  if (all) all.onclick = async () => {
    if (!confirm("把通道连得上的所有机器更新到最新发布的版本？每台会先停下检测，装好后原来在跑的会自己接着跑。")) return;
    all.disabled = true;
    try { const r = await api.command("*", "update", who()); toast(`已发给 ${r.sent.length} 台机器`); }
    catch (e) { toast(e.message); }
    setTimeout(again, 4000);
  };
}

async function refreshMachinesPage() {
  if (view !== "machines" || document.hidden) return;
  clearTimeout(pollTimer);
  const asked = mView;
  try {
    if (asked) { const d = await api.machine(asked, midnight(), mHours); pinThumbs(d.recent); mData = d; }
    else { const r = await api.machines(midnight()); machinesData = r.machines; machinesMeta = { latest: r.latest, hosts: r.hosts || [], channelOnline: r.channel_online, events: r.events || [], errorsOpen: r.errors_open, hostSeen: r.host_seen }; }
    mFailed = 0;
  } catch (e) {
    mFailed++;
    if (view === "machines" && asked === mView) {
      if ($("#main .dash")) toast("读取失败，稍后自动重试：" + e.message);
      else $("#main").innerHTML = `<div class="empty">加载失败：${esc(e.message)}，正在重试…</div>`;
    }
  }
  if (view !== "machines") return;
  if (asked === mView && !mFailed) {
    // the pictures of the latest results are lifted out and put back when nothing new finished,

    const kept = $("#mRecent");

    const fresh = $("#mRecent");
    if (kept && fresh && kept.dataset.key === fresh.dataset.key) fresh.replaceWith(kept);
    wireMachines();
  }
  pollTimer = setTimeout(refreshMachinesPage, mFailed ? Math.min(60000, 5000 * mFailed) : 10000);
}

const VERDICT = { block: "拦截", review: "待确认", pass: "放行" };

const rf = { ...RF_DEFAULT };
const RF = {
  verdict: ["结论", { flagged: "拦截和待确认", block: "拦截", review: "待确认", pass: "放行" }],

RF.repeat = ["重复", { "2+": "有重复（2 单以上）", "5+": "5 单以上", "10+": "10 单以上", once: "没有重复（只 1 单）" }];
const rfAsk = () => { const { repeat, ...ask } = rf;
  return { ...ask, ...(repeat === "once" ? { max: 1 } : repeat ? { min: parseInt(repeat, 10) } : {}) }; };
const RF_SORT = { easy: "最容易判断的在前", last: "最新的在前", orders: "订单最多的在前", first: "最早出现的在前" };
const rfKey = () => JSON.stringify(rf);

// Claude's opinion in one line, for a card: who it says owns it, or that it sees no IP.
function claudeLine(c) {
  if (!c) return "";
  const owners = [...(c.candidates || []).filter(x => x.is_ip === "yes").map(x => x.owner || x.name),
                  ...(c.other_ip || []).map(o => o.owner || o.name)].filter(Boolean);
  const first = owners[0] ? "：" + owners[0] : "";
  return c.verdict === "ip" ? `<span class="sn ip">Sonnet：是 IP${esc(first)}</span>`
    : c.verdict === "not_ip" ? `<span class="sn no">Sonnet：不是 IP</span>` : `<span class="sn un">Sonnet：拿不准</span>`;
}
// The same opinion in full, for the review tab and wherever there is room.
function claudeBlock(c) {
  const head = { ip: "有 IP", not_ip: "没有 IP", unsure: "拿不准" }[c.verdict] || c.verdict;
  return `<div class="snbox"><b>Sonnet 的看法：${esc(head)}</b>
    ${(c.candidates || []).length ? `<table>${c.candidates.map(x => `<tr><td>${esc(x.name)}</td><td>${ISIP[x.is_ip] || esc(x.is_ip)}</td><td>${esc(x.owner || "")}</td><td>${esc(x.reason || "")}</td></tr>`).join("")}</table>` : ""}
    ${(c.other_ip || []).length ? `<div>另外认出：${c.other_ip.map(o => esc(o.name) + (o.owner ? `（${esc(o.owner)}）` : "")).join("、")}</div>` : ""}</div>`;
}
let recsDrawn = "";  // what the list on screen was drawn from; redrawn only when this changes

// The server signs a fresh link for a thumbnail on every answer. Keep the first one per picture

const thumbLinks = new Map();
function pinThumbs(list) {
  for (const x of list || []) {
    if (!x || !x.thumb_path || !x.thumb_url) continue;
    const had = thumbLinks.get(x.thumb_path);
    if (had && Date.now() - had.at < 36000000) x.thumb_url = had.url;
    else thumbLinks.set(x.thumb_path, { url: x.thumb_url, at: Date.now() });
  }
  return list;
}
const recsKey = () => rfKey() + recTotal + "|" + recs.map(r => r.id + (r.human || "") + r.verdict + (r.claude ? "c" : "")).join(",");

function recordsHtml() {

async function loadRecords(more) {
  if (recBusy) return;  // what was chosen meanwhile is read when this answer is in (see below)
  recBusy = true;
  const asked = rfKey();
  try {
    const res = await api.designs({ ...rfAsk(), limit: 48, offset: more ? recs.length : 0, cards: true });
    // a card is the design's newest order file: that is the record the sheet opens
    const got = pinThumbs(res.items.filter(d => d.job).map(d => ({ ...d, id: d.job, design: d.id,
      human: d.source === "human" ? "yes" : "", finished_at: d.last_at })));
    recs = more ? recs.concat(got) : got;
    recTotal = res.total;
  } catch (e) { toast(e.message); }
  recBusy = false;
  if (asked !== rfKey()) return loadRecords(false);  // other filters were chosen
  recsDrawn = "";
  loadRecords.redraw();
}

loadRecords.redraw = () => {
  const box = $("#records");

  recsDrawn = recsKey();

function detailHtml(d) {

  const hits = r ? r.hits || [] : [], cl = ex.claude;
  const items = (ex.vlm_items || []).filter(i => i.by !== "claude" && (i.kind || i.evidence));
  const step = (n, title, body) => `<div class="step"><b class="n">${n}</b><b>${title}</b>${body}</div>`;
  const hitRows = det => hits.filter(h => h.detector === det).map(h =>
    `<tr><td>${esc(h.label.startsWith("unlisted:") ? h.label.slice(9) : nameOf(h.label))}</td>

     <td>${Number(h.score).toFixed(2)}</td><td class="raw">${esc(h.detail || "")}</td></tr>`).join("");
  const table = (head, rows) => rows ? `<table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows}</table>` : `<div class="muted">没有命中</div>`;
  const used = name => { const low = String(name).toLowerCase();
    const h = hits.find(h => h.detector === "vlm" && (h.label.toLowerCase() === "unlisted:" + low || String(h.detail || "").toLowerCase().startsWith(low)));
    return h ? `<span class="pill ${esc(h.verdict)}">${h.label.startsWith("unlisted:") ? "名单外，" : "名单内，"}${VERDICT[h.verdict]}</span>` : `<span class="muted">没有采用</span>`; };
  const ms = k => r && r.timings_ms && r.timings_ms[k] != null ? ` <span class="muted">${(r.timings_ms[k] / 1000).toFixed(1)} 秒</span>` : "";

  if (j.cached && d.design) body += `<div class="step"><b>这张是重复设计</b>
    <div>它和设计 #${d.design.id} 是同一个图案（这个设计已出现 ${num(d.orders)} 单），所以没有重新检测，直接沿用了那个设计的结论。
    结论来源：${esc(SOURCE[d.design.source] || d.design.source)}。下面是那个设计第一次检测时的判断过程。</div></div>`;
  if (!r) body += `<div class="step"><b>判断过程已过期</b><div class="muted">云端只保留最近 7 天的判断过程，更早的在检测机器本地和 NAS 的存档里。</div></div>`;
  else if (!r.hits && !r.extra) body += `<div class="step"><b>没有保存判断过程</b><div class="muted">这张图是在"保存全部判断过程"功能上线前检测的，当时放行的图不留记录。</div></div>`;
  else {
    body += step(1, "文字识别" + ms("ocr"), `<div class="raw">${esc(ex.ocr_text || "（没有读到文字）")}</div>` + (hitRows("ocr") ? table(["读到的名字", "结论", "分数", "细节"], hitRows("ocr")) : ""));
    body += step(2, "图案检测和图库比对" + ms("owl") + ms("gallery"), table(["像什么", "结论", "分数", "细节"], hitRows("owl") + hitRows("gallery")));
    body += step(3, "本地小模型看图" + ms("vlm"), ex.vlm_skipped ? `<div class="muted">前面已经判了拦截，小模型这一步跳过了。</div>` :
      (items.length ? `<table><tr><th>它认出的东西</th><th>类别</th><th>依据</th><th>把握</th><th>它认为属于</th><th>规则怎么处理</th></tr>${items.map(i =>
        `<tr><td>${esc(i.name)}</td><td>${esc(KIND[i.kind] || i.kind || "")}</td><td>${esc(String(i.evidence || "").split("|").map(e => EVIDENCE[e] || e).join("；"))}</td>
         <td>${i.confidence != null ? Number(i.confidence).toFixed(2) : ""}</td><td>${esc(i.franchise_or_owner || "")}</td><td>${used(i.name)}</td></tr>`).join("")}</table>
         <div class="muted" style="margin-top:6px">"没有采用"的原因是下面之一：把握低于门槛、类别不在送审范围、属于忽略词（国家、节日、订单标签上的字等）。</div>`
        : `<div class="muted">小模型没有认出任何可能是 IP 的东西。</div>`));
    body += step(4, "Claude 复核" + ms("claude"), cl ? `<div>整体判断：<b>${{ ip: "有 IP", not_ip: "没有 IP，放行", unsure: "拿不准，留给人看" }[cl.verdict] || esc(cl.verdict)}</b>
        <span class="muted">（用了 ${num((cl.usage || {}).in)} + ${num((cl.usage || {}).out)} token）</span></div>
        ${(cl.candidates || []).length ? `<table><tr><th>名字</th><th>判断</th><th>权利人</th><th>理由</th></tr>${cl.candidates.map(c =>
          `<tr><td>${esc(c.name)}</td><td>${ISIP[c.is_ip] || esc(c.is_ip)}</td><td>${esc(c.owner)}</td><td>${esc(c.reason)}</td></tr>`).join("")}</table>` : ""}
        ${(cl.other_ip || []).length ? `<div>Claude 另外认出：${cl.other_ip.map(o => esc(o.name) + (o.owner ? `（${esc(o.owner)}）` : "")).join("、")}</div>` : ""}
        ${cl.asked_by ? `<div class="muted">这是在复查页面上手动问的（${esc(cl.asked_by)}），只供参考，没有改动结论。</div>` : ""}
        <div><button class="askbtn" id="askClaude">再让 Sonnet 看一次</button></div>`
      : `<div class="muted">没有发给 Claude。只有"仅因名单外的名字而待确认"的图才会自动发；已拦截的、命中名单的、完全没问题的都不发。</div>
         <div><button class="askbtn" id="askClaude">让 Sonnet 看一下</button> <span class="muted">约 $0.005 一次，计入每天 $10 的额度。它说"是 IP"，这个设计就直接拦截；说"不是"或"拿不准"不改结论，由你点"侵权 / 放行"。</span></div>`);
  }
  // The verdict that counts is the design's, as it is now: its files follow it (lg_jobs.verdict);
  // checked_verdict is what was said when this file was checked, if that was something else.
  const was = j.checked_verdict || j.verdict;
  const moved = !!(d.design && d.design.verdict !== was);
  const now = d.design ? { verdict: d.design.verdict, labels: d.design.labels || j.labels } : j;
  return `<div class="box"><button class="x" id="sheetX" aria-label="关闭">×</button>
    <div class="top"><div>${d.thumb_url ? `<img src="${esc(d.thumb_url)}" alt="">` : `<div class="dcard"><div class="noimg">无缩略图</div></div>`}</div>
    <div><h3><span class="pill ${esc(now.verdict)}">${VERDICT[now.verdict] || ""}</span> ${esc((now.labels || "").split("; ").filter(Boolean).map(nameOf).join("、") || "没有发现问题")}</h3>
      ${moved ? `<div class="moved">这个文件检测的时候是<b>${VERDICT[was]}</b>，后来这个设计的结论改成了<b>${VERDICT[now.verdict]}</b>（${esc(SOURCE[d.design.source] || d.design.source)}），所有订单都跟着改了。</div>` : ""}
      <table><tr><th>文件</th><td class="raw">${esc(j.file_name || "")}</td></tr>
      <tr><th>文件夹</th><td>${esc(j.folder || "")}</td></tr>
      ${d.machine_state ? `<tr><th>当时这台机器</th><td>${esc(stateLine(d.machine_state, d.machine_hw))}${d.machine_state.per_10min != null ? ` · 那 10 分钟检测了 ${num(d.machine_state.per_10min)} 张` : ""}
        <span class="muted">（${hhmm(d.machine_state.at)} 的采样${d.machine_hw && d.machine_hw.gpu ? "，" + esc(d.machine_hw.gpu) : ""}）</span></td></tr>` : ""}
      <tr><th>检测时间</th><td>${new Date(j.finished_at).toLocaleString("zh-CN", { hour12: false })}，机器 ${esc(j.machine || "")}${j.cached ? "，重复设计没有上 GPU" : `，用时 ${Number(j.seconds || 0).toFixed(1)} 秒`}</td></tr>
      ${d.design ? `<tr><th>所属设计</th><td>#${d.design.id}，共 ${num(d.orders)} 单，当前结论：${VERDICT[d.design.verdict]}（${esc(SOURCE[d.design.source] || d.design.source)}）</td></tr>` : ""}
      </table>
      <div class="label">
        <div class="lq">${d.decision ? `已标注：<b>${DECIDED[d.decision.decision] || ""}</b>${d.decision.ip ? "（" + esc(nameOf(d.decision.ip)) + "）" : ""}${d.decision.reviewer_label ? " · " + esc(d.decision.reviewer_label) : ""} · 可以改` : "你的判断：这张图有没有用别人的 IP？"}</div>
        <div class="lbtns">
          <button class="yes" data-d="infringing">侵权<kbd>1</kbd></button>
          <button class="no" data-d="false_positive">放行<kbd>2</kbd></button>
        </div>
        <input id="sheetIp" list="iplist" placeholder="侵权的是哪个 IP（选“是”时填，可以直接写名字）" value="${esc(suggestIp(d))}">
        <div class="muted">标完就关闭，回到列表 · ← → 换图 · Esc 关闭。拿不准的不用标，留着就行。标注对这个设计的所有订单生效，以后再出现直接沿用。</div>
      </div></div></div>
    <h4>判断过程</h4>${body}</div>`;
}

const DECIDED = { infringing: "侵权", false_positive: "放行", unsure: "不确定" };
// What to offer as the IP: the earlier human answer, else what the machines named.
function suggestIp(d) {
  if (d.decision && d.decision.ip) return nameOf(d.decision.ip);
  const first = (d.job.labels || "").split("; ").filter(Boolean)[0] || "";
  return first.startsWith("known:") ? "" : nameOf(first);
}

let sheetJob = null;  // the record the sheet is showing

function closeSheet() { $("#sheet").classList.remove("show"); sheetJob = null; loadRecords.redraw(); }

// The neighbour of the open record in the list on screen (dir: +1 older, -1 newer).
function sheetStep(dir) {
  const i = recs.findIndex(r => String(r.id) === String(sheetJob));
  const next = i < 0 ? null : recs[i + dir];
  if (next) showDetail(next.id); else if (dir > 0) { if (i >= 0) toast("这一页看完了"); closeSheet(); }
}

// Record a person's answer for a finished image. Every card of the same design on screen
// takes it at once: the answer is for the design, whatever order it came in.
async function recordAnswer(id, decision, ip) {
  const res = await api.decideJob(id, decision, ip, $("#reviewer").value.trim() || null);
  toast("已记录：" + DECIDED[decision]);
  const rec = recs.find(r => String(r.id) === String(id));
  for (const r of recs) {
    if (!(r === rec || (rec && rec.design && r.design === rec.design))) continue;
    if (res.verdict) r.verdict = res.verdict;
    if (ip) r.labels = ip;
    r.human = decision;
  }
}

async function sheetDecide(decision) {
  const id = sheetJob, text = ($("#sheetIp") || {}).value || "";
  if (!id) return;
  const ip = decision === "infringing" && text.trim() ? (ipByName[text.trim().toLowerCase()] || text.trim()) : null;
  $("#sheet").querySelectorAll(".lbtns button").forEach(b => { b.disabled = true; });
  try { await recordAnswer(id, decision, ip); }
  catch (e) { alert("保存失败：" + e.message); $("#sheet").querySelectorAll(".lbtns button").forEach(b => { b.disabled = false; }); return; }
  closeSheet();  // back to the list: the reviewer picks the next one, it is not a queue
}

// 侵权 / 放行 right on a card. The IP is what the machines named first (it can be corrected
// in the record); a design that is merely similar to a takedown has no name to offer.
async function quickDecide(button) {
  const card = button.closest(".dcard"), id = card.dataset.job, decision = button.dataset.d;
  const rec = recs.find(r => String(r.id) === String(id));
  const first = ((rec && rec.labels) || "").split("; ").filter(Boolean)[0] || "";
  const ip = decision === "infringing" && first && !first.startsWith("known:") ? first : null;
  card.querySelectorAll(".quick button").forEach(b => { b.disabled = true; });
  try { await recordAnswer(id, decision, ip); }
  catch (e) { alert("保存失败：" + e.message); }
  loadRecords.redraw();
}

// id: a record (job); with ofDesign, a design from "订单最多的设计" - its latest file is shown.
// "让 Sonnet 看一下": the reviewer asks Claude about the image in the sheet. Advice for the
// person labelling; it costs about half a cent and counts against the day's budget.
async function askClaude(button) {
  const id = sheetJob;
  if (!id) return;
  button.disabled = true; button.textContent = "Sonnet 正在看…（几秒钟）";
  try {
    const r = await api.askClaude(id, $("#reviewer").value.trim() || null);
    toast(`Sonnet 已回答 · 这次 $${Number(r.usd).toFixed(4)} · 今天共 $${Number(r.spent).toFixed(2)} / $${r.limit}`);
    if (sheetJob === id) showDetail(id);  // the sheet now shows the answer in step 4
  } catch (e) { alert("没有问成：" + e.message); button.disabled = false; button.textContent = "让 Sonnet 看一下"; }
}

async function showDetail(id, ofDesign) {
  const sheet = $("#sheet");
  sheetJob = id;
  sheet.innerHTML = `<div class="box"><div class="empty">加载中…</div></div>`;
  sheet.classList.add("show");
  try {
    const d = ofDesign ? await api.detailOfDesign(id) : await api.detail(id);
    if (sheetJob !== id) return;
    sheetJob = d.job.id;  // what a label is recorded against
    sheet.innerHTML = detailHtml(d);
  }
  catch (e) { sheet.innerHTML = `<div class="box"><button class="x" id="sheetX">×</button><div class="empty">加载失败：${esc(e.message)}</div></div>`; }
  const x = $("#sheetX"); if (x) x.onclick = closeSheet;
  sheet.querySelectorAll(".lbtns button").forEach(b => { b.onclick = () => sheetDecide(b.dataset.d); });
  const ask = $("#askClaude"); if (ask) ask.onclick = () => askClaude(ask);
  sheet.scrollTop = 0;
}

document.addEventListener("keydown", e => {
  if (!sheetJob || !$("#sheet").classList.contains("show")) return;
  if (e.key === "Escape") { closeSheet(); return; }
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const d = { "1": "infringing", "2": "false_positive" }[e.key];
  if (d) { e.preventDefault(); sheetDecide(d); }
  else if (e.key === "ArrowRight") { e.preventDefault(); sheetStep(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); sheetStep(-1); }
});

let active = false, scanDay = "", lastSeen = "", lastTyped = 0, dashFailed = 0;
const TYPING_GRACE_MS = 6000;
const todayMmdd = () => { const n = new Date(); return String(n.getMonth() + 1).padStart(2, "0") + String(n.getDate()).padStart(2, "0"); };

document.addEventListener("click", async e => {

async function refreshDashboard() {
  if (view !== "dash" || document.hidden) return;
  clearTimeout(pollTimer);
  // Do not redraw under someone typing the date - but only while they are typing: a caret left
  // in the box must not freeze the page.
  const typing = document.activeElement && document.activeElement.id === "scanDay"
    && Date.now() - lastTyped < TYPING_GRACE_MS;
  if (!typing) {
    let data = null;
    try { [data] = await Promise.all([api.dashboard(), refreshPlatforms()]); dashFailed = 0; }
    catch (e) {
      // One failed read must not stop the page for good: keep what is shown, say so, try again.
      dashFailed++;
      if (!$("#records")) $("#main").innerHTML = `<div class="empty">加载失败：${esc(e.message)}，正在重试…</div>`;
      else toast("读取失败，稍后自动重试：" + e.message);
      pollTimer = setTimeout(refreshDashboard, Math.min(60000, 5000 * dashFailed));
      return;
    }
    pinThumbs(data.top_designs); pinThumbs(data.recent);
    // The numbers are redrawn every time, the record list is not: its cards (and their pictures)
    // are lifted out and put back, so nothing flickers or reloads under the reader's eyes.
    const kept = $("#records");
    $("#main").innerHTML = dashboardHtml(data);
    const tm = $("#toMachines"); if (tm) tm.onclick = () => setView("machines");
    if (kept && kept.childElementCount) $("#records").replaceWith(kept);
    // Ask for the list only when the newest finished image changed (the numbers already say which).
    const stamp = (data.recent && data.recent[0] ? data.recent[0].id : "") + "";
    if (rf.sort === "last" && recs.length <= 48) {
      // newest first, first page: follow the detection as it goes
      if (stamp !== lastSeen && !$("#sheet").classList.contains("show")) { lastSeen = stamp; await loadRecords(false); }
    } else if (!recs.length && lastSeen !== stamp + rfKey()) {
      // any other order: keep what the reviewer is working down; read it once
      lastSeen = stamp + rfKey(); await loadRecords(false);
    }
    loadRecords.redraw();
    document.querySelectorAll(".dgrid .dcard[data-design]").forEach(c => { c.onclick = () => showDetail(c.dataset.design, true); });
    const pz = $("#pauseGo");
    if (pz) pz.onclick = async () => {
      const stop = pz.dataset.paused !== "1";
      if (stop && !confirm("暂停检测？检测机器会把手头已经拿到的图做完（每台最多 32 张），然后停下。排队的图不会丢，点「继续检测」就接着做。")) return;
      pz.disabled = true;
      try { await api.pause(stop, $("#reviewer").value.trim()); toast(stop ? "已暂停" : "已继续"); }
      catch (e) { toast(e.message); }
      refreshDashboard();
    };
    const fl = $("#fleetGo");
    if (fl) fl.onclick = async () => {
      const start = fl.dataset.go !== "1";
      if (start && !confirm("让车间的全部机器一起检测？不限时间，白天夜里都会工作，直到你点“让其它机器停下”；机器在生成 PRN 时自己让路。")) return;
      fl.disabled = true;
      try { await api.fleet(start, $("#reviewer").value.trim()); toast(start ? "已放行，不限时间" : "其它机器会把手头的做完后停下"); }
      catch (e) { toast(e.message); }
      refreshDashboard();
    };
    const go = $("#scanGo"), day = $("#scanDay");
    if (day) day.oninput = () => { scanDay = day.value.trim(); lastTyped = Date.now(); };
    if (go) go.onclick = async () => {
      const v = day.value.trim();
      if (!/^\d{4}$/.test(v)) { toast("日期要写成 4 位数字，例如 1005"); return; }
      if (!confirm(`开始检测 ${v.slice(0, 2)}-${v.slice(2)} 文件夹里的全部图片？`)) return;
      go.disabled = true;
      try { await api.scan(v, $("#reviewer").value.trim()); toast("已发出，检测主机几秒内接手"); }
      catch (e) { toast(e.message); }
      refreshDashboard();
    };
  }
  pollTimer = setTimeout(refreshDashboard, active ? 10000 : 60000);
}

function designsHtml() {

// One picture per design with the order label cut off, gathered by the host machine in a folder.

let collectTimer = null;
async function watchCollect() {
  clearTimeout(collectTimer);
  if (view !== "designs") return;
  try { const was = JSON.stringify(dz.got); dz.got = (await api.collects()).requests[0] || null;
    if (was !== JSON.stringify(dz.got)) drawDesigns(); } catch (e) { /* asked again below */ }
  if (collecting()) collectTimer = setTimeout(watchCollect, 4000);
}
async function askCollect(everything) {
  let ids = [...dz.picked.keys()];
  try {
    if (everything) {
      ids = [];
      for (let at = 0; at < dz.total; at += 500) ids = ids.concat((await api.designs({ ...dzAsk(), limit: 500, offset: at, files: true })).items.map(r => r.id));
    }
    dz.got = (await api.collect(ids, $("#reviewer").value.trim() || null)).request;
  } catch (e) { return toast(e.message); }
  drawDesigns(); watchCollect();
}

function drawDesigns() {
  if (view !== "designs") return;
  $("#main").innerHTML = designsHtml();
  const again = () => { dz.offset = 0; loadDesigns(); };
  document.querySelectorAll(".dz [data-f]").forEach(el => el.onchange = () => { dz[el.dataset.f] = el.value.trim(); again(); });
  document.querySelectorAll(".dz th.sort").forEach(h => h.onclick = () => {
    if (dz.sort === h.dataset.s) dz.dir = dz.dir === "desc" ? "asc" : "desc"; else { dz.sort = h.dataset.s; dz.dir = "desc"; }
    again(); });
  document.querySelectorAll(".dz tr.row").forEach(tr => tr.onclick = e => {
    if (e.target.closest("input")) return;
    if (tr.dataset.job) showDetail(tr.dataset.job); });
  document.querySelectorAll(".dz td input[type=checkbox]").forEach(c => c.onchange = () => {
    const r = dz.rows.find(x => String(x.id) === c.dataset.id);
    if (c.checked) dz.picked.set(r.id, r); else dz.picked.delete(r.id);
    dz.note = ""; drawDesigns(); });
  $("#dzAll").onchange = e => { for (const r of dz.rows) { if (e.target.checked) dz.picked.set(r.id, r); else dz.picked.delete(r.id); } dz.note = ""; drawDesigns(); };
  $("#dzPrev").onclick = () => { dz.offset = Math.max(0, dz.offset - DZ_PAGE); loadDesigns(); };
  $("#dzNext").onclick = () => { dz.offset += DZ_PAGE; loadDesigns(); };
  $("#dzGet").onclick = () => askCollect(false);
  $("#dzGetAll").onclick = () => askCollect(true);
  $("#dzOut").onclick = () => exportDesigns(false);
  $("#dzOutAll").onclick = () => exportDesigns(true);
}

let dzAsked = 0;
async function loadDesigns() {
  const mine = ++dzAsked;
  dz.busy = true; drawDesigns();
  try {
    const res = await api.designs({ ...dzAsk(), limit: DZ_PAGE, offset: dz.offset });
    if (mine !== dzAsked) return;  // a newer question is on its way
    dz.rows = pinThumbs(res.items); dz.total = res.total;
  } catch (e) { if (mine === dzAsked) toast(e.message); }
  if (mine !== dzAsked) return;
  dz.busy = false; drawDesigns();
}

// The file list as a spreadsheet: one line per file, with where it is on the NAS.
async function exportDesigns(everything) {
  let rows = [];
  try {
    if (everything) {
      for (let at = 0; at < dz.total && at < 20000; at += 500) {
        dz.note = `正在准备清单… ${num(at)} / ${num(dz.total)}`; drawDesigns();
        rows = rows.concat((await api.designs({ ...dzAsk(), limit: 500, offset: at, files: true })).items);
      }
    } else {
      // the picked designs, wherever in the table they were picked: ask for each one's files
      const ids = [...dz.picked.keys()];
      for (let i = 0; i < ids.length; i += 200) {
        dz.note = `正在准备清单… ${num(i)} / ${num(ids.length)}`; drawDesigns();
        rows = rows.concat((await api.designs({ ids: ids.slice(i, i + 200), files: true, limit: 200, sort: "orders" })).items);
      }
    }
  } catch (e) { dz.note = ""; drawDesigns(); return toast(e.message); }
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const head = ["设计编号", "订单数", "名称", "结论", "谁定的", "Sonnet", "本地模型", "客户", "日期", "第几个文件", "文件路径"];
  const lines = [head.map(cell).join(",")];
  let files = 0;
  for (const r of rows) (r.files || []).forEach((f, i) => { files++; lines.push([r.id, r.orders,
    r.labels.split("; ").filter(Boolean).map(nameOf).join("、"), VERDICT[r.verdict] || r.verdict, BY[r.source] || r.source,
    r.sonnet ? SAID[r.sonnet] : "", r.local ? LOCAL[r.local] : "", r.customers.join("、"), r.days.join("、"), i + 1, f].map(cell).join(",")); });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv" }));
  a.download = `LogoGuard-设计文件清单-${todayMmdd()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  dz.note = `已导出 ${num(rows.length)} 个设计、${num(files)} 个文件`; drawDesigns();
}

async function refreshSonnet() {
  if (view !== "sonnet" || document.hidden) return;
  clearTimeout(pollTimer);
  try {
    const d = await api.sonnet(); pinThumbs(d.log); sonnetFailed = 0;
    if (view !== "sonnet") return;
    $("#main").innerHTML = sonnetHtml(d);
    $("#main").querySelectorAll("tr[data-job]").forEach(r => r.onclick = () => showDetail(r.dataset.job));
    $("#main").querySelectorAll("#sonnetDisagree .dcard[data-job]").forEach(c => c.onclick = () => showDetail(c.dataset.job));
    $("#main").querySelectorAll("#sonnetDisagree .quick button").forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const card = b.closest(".dcard");
      card.querySelectorAll("button").forEach(x => x.disabled = true);
      try {
        await api.decideJob(card.dataset.job, b.dataset.d, b.dataset.d === "infringing" ? (b.dataset.ip || null) : null, $("#reviewer").value.trim() || null);
        toast("已记录：" + (b.dataset.d === "infringing" ? "侵权" : "放行") + "，这个设计以后都按这个结论");
      } catch (err) { toast(err.message); }
      refreshSonnet();
    });
    $("#main").querySelectorAll("button[data-rule]").forEach(b => b.onclick = async e => {
      e.stopPropagation();
      const off = b.dataset.rule === "off", n = off ? null : Number(b.dataset.rule), per = Number(d.avg_usd) || 0.0058;
      const say = off ? "关闭规则？之后每台机器第一次见到一个设计就会问 Sonnet，额度先到先得。"
        : `改成只看 ${n} 单以上的设计？\n\n还没看过的有 ${b.dataset.ask} 个，全部看完约 $${(b.dataset.ask * per).toFixed(2)}，在每天 $${d.limit} 的额度内分天花完。`;
      if (!confirm(say)) return;
      b.disabled = true;
      try { await api.sonnetRule(n); toast(off ? "规则已关闭" : `已改成 ${n} 单以上`); } catch (err) { toast(err.message); }
      refreshSonnet();
    });
  } catch (e) {
    sonnetFailed++;
    if (view !== "sonnet") return;
    if ($("#main .dash")) toast("读取失败，稍后自动重试：" + e.message);
    else $("#main").innerHTML = `<div class="empty">加载失败：${esc(e.message)}，正在重试…</div>`;
  }
  pollTimer = setTimeout(refreshSonnet, sonnetFailed ? Math.min(60000, 5000 * sonnetFailed) : 10000);
}

// ---- 妙手图: the products in 妙手's collect box, judged by their main picture -------------------
// Another source than the orders (product photos, not print files), so its own list and its
// own numbers. ImageGrab keeps a copy of the box and sends each main picture to be judged; the
// answers are the same three and go into the record ImageGrab's results page writes.
// The stream itself, live: what arrives, what waits, what was found, who judges. Redrawn every
// 15 seconds in its own box, so the list below stays still under the person labelling.
const msDur = s => s == null ? "–" : s < 90 ? `${Math.round(s)} 秒` : s < 5400 ? `${Math.round(s / 60)} 分钟` : `${(s / 3600).toFixed(1)} 小时`;
const msAgo = t => t ? msDur((Date.now() - new Date(t).getTime()) / 1000) + "前" : "–";
function msHoursHtml(rows) {
  const hours = rows || [], sum = h => Number(h.pass) + Number(h.review) + Number(h.block) + Number(h.errors);
  const top = Math.max(1, ...hours.map(h => Math.max(Number(h.arrived), sum(h))));
  const col = (h, body, title) => `<div class="hb" title="${new Date(h.hour).getHours()}:00–${new Date(h.hour).getHours()}:59  ${title}">${body}</div>`;
  const seg = (n, color) => n ? `<i style="height:${n / top * 100}%;background:${color};border-radius:0"></i>` : "";
  return `<div class="muted" style="margin:2px 0 4px">送来的</div>
    <div class="hbars" style="height:70px">${hours.map(h => col(h, `<i style="height:${h.arrived / top * 100}%"></i>`, `送来 ${h.arrived} 张`)).join("")}</div>
    <div class="muted" style="margin:10px 0 4px">判断完的</div>
    <div class="hbars" style="height:70px">${hours.map(h => col(h, seg(h.errors, "#999") + seg(h.block, "var(--red)") + seg(h.review, "var(--amber)") + seg(h.pass, "var(--green)"),
      `判断完 ${sum(h)} 张：放行 ${h.pass} · 待确认 ${h.review} · 拦截 ${h.block}${Number(h.errors) ? " · 出错 " + h.errors : ""}`)).join("")}</div>
    <div class="hlabels">${hours.map(h => `<span>${new Date(h.hour).getHours()}</span>`).join("")}</div>
    <div class="hkey">最高的一小时 ${num(top)} 张 · 绿 放行 · 橙 待确认 · 红 拦截 · 灰 出错 · 鼠标放在柱子上看那一小时的数字</div>`;
}

async function loadMs(more) {
  if (view !== "ms") return;
  try {
    const d = await api.msItems(mz.level, mz.owner, more ? mz.items.length : 0);
    if (view !== "ms") return;
    mz.items = more ? mz.items.concat(d.items) : d.items;
    mz.counts = d.counts; mz.owners = d.owners; mz.more = d.items.length === 48;
  } catch (e) { $("#main").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`; return; }
  $("#main").innerHTML = msHtml();
  const again = () => { mz.items = []; $("#main").innerHTML = `<div class="empty">加载中…</div>`; loadMs(); };
  $("#msLevels").querySelectorAll("button[data-level]").forEach(b => b.onclick = () => { mz.level = b.dataset.level; again(); });
  $("#msOwners").querySelectorAll("button").forEach(b => b.onclick = () => { mz.owner = b.dataset.owner || null; again(); });
  const m = $("#msMore"); if (m) m.onclick = () => { m.disabled = true; loadMs(true); };
  const cp = $("#msCopy"); if (cp) cp.onclick = async () => {
    cp.disabled = true;
    try { const { ids } = await api.msIds(mz.level, mz.owner); copy(ids.join("\n"), ` ${MS_LEVELS[mz.level]}的 ${num(ids.length)} 个商品 ID`); }
    catch (e) { alert("没有取到：" + e.message); }
    cp.disabled = false;
  };
  $("#msFeed").querySelectorAll(".quick button").forEach(b => b.onclick = () => msDecide(b));
}
async function msDecide(button) {
  const card = button.closest(".dcard"), url = card.dataset.url, decision = button.dataset.d;
  const it = mz.items.find(x => x.url === url);
  const first = ((it && it.labels) || "").split("; ").filter(Boolean)[0] || "";
  card.querySelectorAll(".quick button").forEach(b => { b.disabled = true; });
  try {
    const r = await api.msDecide(url, decision, decision === "infringing" ? first : null, $("#reviewer").value.trim() || null);
    toast("已标注" + (r.ledger && decision !== "unsure" ? "，同图案的订单设计也跟着走" : ""));
    // the product leaves the list it was in (it is "已标注" now); the numbers follow at once
    const was = it && it.human ? "labelled" : mz.level;
    const gone = mz.items.filter(x => x.url === url).length;   // products sharing this main picture
    mz.items = mz.items.filter(x => x.url !== url);
    if (was !== "labelled") { mz.counts[was] = Math.max(0, (mz.counts[was] || 0) - gone); mz.counts.labelled = (mz.counts.labelled || 0) + gone; }
    if (mz.level === "labelled" || !mz.items.length || gone > 1) loadMs(); else card.remove();
  } catch (e) { alert("保存失败：" + e.message); card.querySelectorAll(".quick button").forEach(b => { b.disabled = false; }); }
}
